# Settings of `cargo nextest` (`just test`, docs/development.md). The e2e suite does not use it:
# `deploy/e2e/e2e-local.sh` runs `cargo test` per binary.

[profile.default]
# Report every failure of a run instead of stopping at the first one.
fail-fast = false
# A test that runs longer than 60 s is reported by name while it runs (database tests start a
# container on a cold machine); one that hangs for 10 minutes is terminated. No retries: a flaky
# test must stay visible.
slow-timeout = { period = "60s", terminate-after = 10 }
