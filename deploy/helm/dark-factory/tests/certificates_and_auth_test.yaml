suite: Dark Factory Helm Chart - certificates and OIDC
templates:
  - configmap.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  - migrate-job.yaml
  - rbac.yaml
  - sandbox-namespace.yaml
  - certs.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - netpol.yaml
  - httproute.yaml
  - servicemonitor.yaml
tests:
  - it: renders the CA in the cert-manager namespace behind a ClusterIssuer and issues all Certificates from it
    template: certs.yaml
    release:
      name: df
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: cert-manager
        documentIndex: 0
      - isNotNull:
          path: spec.selfSigned
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: cert-manager
        documentIndex: 1
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: NAMESPACE-df-dark-factory-ca-key-pair
        documentIndex: 1
      - isKind:
          of: ClusterIssuer
        documentIndex: 2
      - notExists:
          path: metadata.namespace
        documentIndex: 2
      - equal:
          path: metadata.name
          value: NAMESPACE-df-dark-factory-ca-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: NAMESPACE-df-dark-factory-ca-key-pair
        documentIndex: 2
      - equal:
          path: spec.issuerRef
          value:
            name: NAMESPACE-df-dark-factory-ca-issuer
            kind: ClusterIssuer
            group: cert-manager.io
        documentIndex: 3
      - equal:
          path: spec.secretName
          value: df-dark-factory-control-plane-tls
        documentIndex: 3
      - contains:
          path: spec.dnsNames
          content: df-dark-factory-control-plane.NAMESPACE.svc
        documentIndex: 3
      - equal:
          path: spec.issuerRef.name
          value: NAMESPACE-df-dark-factory-ca-issuer
        documentIndex: 4
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
        documentIndex: 4
      - equal:
          path: spec.secretName
          value: df-dark-factory-gateway-tls
        documentIndex: 4
      - contains:
          path: spec.dnsNames
          content: "*.df-dark-factory-gateway-headless.NAMESPACE.svc.cluster.local"
        documentIndex: 4

  - it: places the CA in a configurable cluster resource namespace
    template: certs.yaml
    set:
      tls.ca.clusterResourceNamespace: certs
    asserts:
      - equal:
          path: metadata.namespace
          value: certs
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: certs
        documentIndex: 1

  - it: configures the gateway link and flow buffer in the release config
    template: configmap.yaml
    release:
      name: df
      namespace: dark-factory
    set:
      gateway.blockedCidrs: ["10.42.0.0/16"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'controlPlaneHost: "df-dark-factory-control-plane"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'identity: "df-dark-factory-gateway"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'headlessService: "df-dark-factory-gateway-headless.dark-factory.svc"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'bufferSize: 10000'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'bufferMaxAgeSeconds: 3600'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'blockedCidrs: \["10.42.0.0/16"\]'
        documentIndex: 0

  - it: renders no auth section until oidc.publicUrl is set
    template: configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'auth:'
        documentIndex: 0

  - it: configures the web UI login when oidc.publicUrl is set
    template: configmap.yaml
    set:
      oidc.publicUrl: https://factory.example.org
      oidc.rolesClaim: groups
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'publicUrl: "https://factory.example.org"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'clientSecretFile: /run/secrets/oidc/client-secret'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rolesClaim: "groups"'
        documentIndex: 0
      - notMatchRegex:
          path: data["migrate-config.yaml"]
          pattern: 'auth:'
        documentIndex: 1

  - it: requests the extra OIDC scopes when oidc.extraScopes is set
    template: configmap.yaml
    set:
      oidc.publicUrl: https://factory.example.org
      oidc.extraScopes: [groups, offline_access]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'extraScopes: \["groups","offline_access"\]'
        documentIndex: 0

  - it: renders no extraScopes by default
    template: configmap.yaml
    set:
      oidc.publicUrl: https://factory.example.org
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'extraScopes'
        documentIndex: 0

  - it: points sandbox certificates at the same issuer the chart renders
    template: configmap.yaml
    release:
      name: df
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "NAMESPACE-df-dark-factory-ca-issuer"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerKind: "ClusterIssuer"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'anyNamespace: false'
        documentIndex: 0

  - it: refuses a namespaced Issuer for sandbox certificates
    template: gateway-deployment.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: Issuer
    asserts:
      - failedTemplate:
          errorPattern: sandbox certificates need a ClusterIssuer

  - it: accepts a namespaced Issuer for the control plane when sandboxes get a ClusterIssuer
    template: configmap.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: Issuer
      sandboxNamespace.issuerName: sandbox-ca
      sandboxNamespace.issuerKind: ClusterIssuer
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "sandbox-ca"'
        documentIndex: 0

  - it: points sandbox certificates at an existing issuer when tls.ca.create is false
    template: configmap.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: ClusterIssuer
      clusterTargets.namespaces: [forgejo, nativelink]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "homelab-ca"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'namespaces: \["forgejo","nativelink"\]'
        documentIndex: 0

  - it: issues Certificates from an existing issuer when tls.ca.create is false
    template: certs.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: ClusterIssuer
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef
          value:
            name: homelab-ca
            kind: ClusterIssuer
            group: cert-manager.io
