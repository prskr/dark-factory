suite: Dark Factory Helm Chart - control plane and migrate job
templates:
  - configmap.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  - migrate-job.yaml
  - rbac.yaml
  - sandbox-namespace.yaml
  - certs.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - netpol.yaml
  - httproute.yaml
  - servicemonitor.yaml
tests:
  - it: renders standard release config ConfigMap and pre-install/pre-upgrade migrate-config ConfigMap
    template: configmap.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentIndex: 0
      - isNotNull:
          path: data["config.yaml"]
        documentIndex: 0
      - isKind:
          of: ConfigMap
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
        documentIndex: 1
      - isNotNull:
          path: data["migrate-config.yaml"]
        documentIndex: 1

  - it: renders control-plane Deployment with D7 ports and health/readiness probes
    template: control-plane-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9443
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9444
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: renders migrate pre-install/pre-upgrade hook Job with owner and app password secret mounts
    template: migrate-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-owner-secret
            mountPath: /run/secrets/db-owner
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-app-secret
            mountPath: /run/secrets/db-app
            readOnly: true

  - it: omits app password secret mount in migrate Job when manageAppRole is false
    template: migrate-job.yaml
    set:
      database.migrate.manageAppRole: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-app-secret
            mountPath: /run/secrets/db-app
            readOnly: true

  - it: prefers a node of its own for every control plane replica by default
    template: control-plane-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    matchLabelKeys: [pod-template-hash]
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: dark-factory
                        app.kubernetes.io/instance: RELEASE-NAME
                        app.kubernetes.io/component: control-plane

  - it: requires a node of its own for every control plane replica with the hard preset
    template: control-plane-deployment.yaml
    set:
      controlPlane.podAntiAffinity: hard
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  matchLabelKeys: [pod-template-hash]
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: dark-factory
                      app.kubernetes.io/instance: RELEASE-NAME
                      app.kubernetes.io/component: control-plane

  - it: renders no control plane affinity with the none preset
    template: control-plane-deployment.yaml
    set:
      controlPlane.podAntiAffinity: none
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: rejects an unknown control plane anti-affinity preset
    template: control-plane-deployment.yaml
    set:
      controlPlane.podAntiAffinity: strict
    asserts:
      - failedTemplate: {}

  - it: replaces the control plane preset by an affinity override
    template: control-plane-deployment.yaml
    set:
      controlPlane.affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: control-plane
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: topology.kubernetes.io/zone
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: control-plane

  - it: keeps the control plane preset for an empty affinity override
    template: control-plane-deployment.yaml
    set:
      controlPlane.affinity: {}
    asserts:
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution

  - it: renders the same pod template for any control plane replica count
    template: control-plane-deployment.yaml
    set:
      controlPlane.replicas: 1
    asserts:
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution
