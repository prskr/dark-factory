suite: Dark Factory Helm Chart Unit Tests
templates:
  - configmap.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  - migrate-job.yaml
  - rbac.yaml
  - sandbox-namespace.yaml
  - certs.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - netpol.yaml
tests:
  - it: renders standard release config ConfigMap and pre-install/pre-upgrade migrate-config ConfigMap
    template: configmap.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentIndex: 0
      - isNotNull:
          path: data["config.yaml"]
        documentIndex: 0
      - isKind:
          of: ConfigMap
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
        documentIndex: 1
      - isNotNull:
          path: data["migrate-config.yaml"]
        documentIndex: 1

  - it: renders control-plane Deployment with D7 ports and health/readiness probes
    template: control-plane-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9443
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9444
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: renders migrate pre-install/pre-upgrade hook Job with owner and app password secret mounts
    template: migrate-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-owner-secret
            mountPath: /run/secrets/db-owner
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-app-secret
            mountPath: /run/secrets/db-app
            readOnly: true

  - it: omits app password secret mount in migrate Job when manageAppRole is false
    template: migrate-job.yaml
    set:
      database.migrate.manageAppRole: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-app-secret
            mountPath: /run/secrets/db-app
            readOnly: true

  - it: renders least-privilege RBAC without pods/exec or pods/attach and supports target namespaces and Cilium mode
    template: rbac.yaml
    set:
      enforcement.mode: cilium
      clusterTargets.namespaces:
        - nativelink
        - forgejo
    asserts:
      - hasDocuments:
          count: 12
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: dark-factory-sandboxes
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["agents.x-k8s.io"]
            resources: ["sandboxes"]
            verbs: ["create", "get", "list", "watch", "patch", "delete"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["cilium.io"]
            resources: ["ciliumnetworkpolicies"]
            verbs: ["create", "get", "list", "watch", "patch", "delete"]
        documentIndex: 2
      - notContains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
        documentIndex: 4
      - equal:
          path: metadata.namespace
          value: nativelink
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["get", "list", "watch"]
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
        documentIndex: 6
      - equal:
          path: metadata.namespace
          value: forgejo
        documentIndex: 8
      - isKind:
          of: ClusterRole
        documentIndex: 10
      - equal:
          path: rules[0].resourceNames
          value: ["dark-factory-sandboxes"]
        documentIndex: 10

  - it: renders release-prefixed ClusterRole when clusterTargets.anyNamespace is true
    template: rbac.yaml
    release:
      name: inst-a
    set:
      clusterTargets.anyNamespace: true
    asserts:
      - hasDocuments:
          count: 10
      - isKind:
          of: ClusterRole
        documentIndex: 6
      - equal:
          path: metadata.name
          value: inst-a-dark-factory-cluster-targets-reader
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["get", "list", "watch"]
        documentIndex: 6

  - it: creates sandbox namespace objects when sandboxNamespace.create is true
    template: sandbox-namespace.yaml
    set:
      sandboxNamespace.create: true
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Namespace
        documentIndex: 0
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: restricted
        documentIndex: 0
      - isKind:
          of: NetworkPolicy
        documentIndex: 1
      - equal:
          path: metadata.name
          value: default-deny-all
        documentIndex: 1
      - isKind:
          of: ResourceQuota
        documentIndex: 2
      - isKind:
          of: LimitRange
        documentIndex: 3
      - isKind:
          of: ServiceAccount
        documentIndex: 4
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 4

  - it: renders no sandbox namespace objects when sandboxNamespace.create is false
    template: sandbox-namespace.yaml
    set:
      sandboxNamespace.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders gateway Deployment with >=2 replicas, automountServiceAccountToken false, PDB, Service, and headless Service
    templates:
      - gateway-deployment.yaml
      - gateway-service.yaml
    asserts:
      - isKind:
          of: Deployment
        template: gateway-deployment.yaml
      - equal:
          path: spec.replicas
          value: 2
        template: gateway-deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: gateway-deployment.yaml
      - isKind:
          of: PodDisruptionBudget
        template: gateway-service.yaml
        documentIndex: 0
      - isKind:
          of: Service
        template: gateway-service.yaml
        documentIndex: 1
      - isKind:
          of: Service
        template: gateway-service.yaml
        documentIndex: 2
      - equal:
          path: spec.clusterIP
          value: None
        template: gateway-service.yaml
        documentIndex: 2

  - it: renders instance NetworkPolicies restricting control-plane and gateway ingress
    template: netpol.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
        documentIndex: 0
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9443
        documentIndex: 0
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9444
        documentIndex: 0
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 8080
        documentIndex: 0
      - isKind:
          of: NetworkPolicy
        documentIndex: 1
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3128
        documentIndex: 1
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9444
        documentIndex: 1

  - it: renders the CA in the cert-manager namespace behind a ClusterIssuer and issues all Certificates from it
    template: certs.yaml
    release:
      name: df
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: cert-manager
        documentIndex: 0
      - isNotNull:
          path: spec.selfSigned
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: cert-manager
        documentIndex: 1
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: NAMESPACE-df-dark-factory-ca-key-pair
        documentIndex: 1
      - isKind:
          of: ClusterIssuer
        documentIndex: 2
      - notExists:
          path: metadata.namespace
        documentIndex: 2
      - equal:
          path: metadata.name
          value: NAMESPACE-df-dark-factory-ca-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: NAMESPACE-df-dark-factory-ca-key-pair
        documentIndex: 2
      - equal:
          path: spec.issuerRef
          value:
            name: NAMESPACE-df-dark-factory-ca-issuer
            kind: ClusterIssuer
            group: cert-manager.io
        documentIndex: 3
      - equal:
          path: spec.secretName
          value: df-dark-factory-control-plane-tls
        documentIndex: 3
      - contains:
          path: spec.dnsNames
          content: df-dark-factory-control-plane.NAMESPACE.svc
        documentIndex: 3
      - equal:
          path: spec.issuerRef.name
          value: NAMESPACE-df-dark-factory-ca-issuer
        documentIndex: 4
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
        documentIndex: 4
      - equal:
          path: spec.secretName
          value: df-dark-factory-gateway-tls
        documentIndex: 4
      - contains:
          path: spec.dnsNames
          content: "*.df-dark-factory-gateway-headless.NAMESPACE.svc.cluster.local"
        documentIndex: 4

  - it: places the CA in a configurable cluster resource namespace
    template: certs.yaml
    set:
      tls.ca.clusterResourceNamespace: certs
    asserts:
      - equal:
          path: metadata.namespace
          value: certs
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: certs
        documentIndex: 1

  - it: points sandbox certificates at the same issuer the chart renders
    template: configmap.yaml
    release:
      name: df
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "NAMESPACE-df-dark-factory-ca-issuer"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerKind: "ClusterIssuer"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'anyNamespace: false'
        documentIndex: 0

  - it: refuses a namespaced Issuer for sandbox certificates
    template: gateway-deployment.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: Issuer
    asserts:
      - failedTemplate:
          errorPattern: sandbox certificates need a ClusterIssuer

  - it: accepts a namespaced Issuer for the control plane when sandboxes get a ClusterIssuer
    template: configmap.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: Issuer
      sandboxNamespace.issuerName: sandbox-ca
      sandboxNamespace.issuerKind: ClusterIssuer
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "sandbox-ca"'
        documentIndex: 0

  - it: points sandbox certificates at an existing issuer when tls.ca.create is false
    template: configmap.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: ClusterIssuer
      clusterTargets.namespaces: [forgejo, nativelink]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "homelab-ca"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'namespaces: \["forgejo","nativelink"\]'
        documentIndex: 0

  - it: issues Certificates from an existing issuer when tls.ca.create is false
    template: certs.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: ClusterIssuer
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef
          value:
            name: homelab-ca
            kind: ClusterIssuer
            group: cert-manager.io
