suite: Dark Factory Helm Chart Unit Tests
templates:
  - configmap.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  - migrate-job.yaml
  - rbac.yaml
  - sandbox-namespace.yaml
  - certs.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - netpol.yaml
  - httproute.yaml
  - servicemonitor.yaml
tests:
  - it: renders standard release config ConfigMap and pre-install/pre-upgrade migrate-config ConfigMap
    template: configmap.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentIndex: 0
      - isNotNull:
          path: data["config.yaml"]
        documentIndex: 0
      - isKind:
          of: ConfigMap
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
        documentIndex: 1
      - isNotNull:
          path: data["migrate-config.yaml"]
        documentIndex: 1

  - it: renders control-plane Deployment with D7 ports and health/readiness probes
    template: control-plane-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9443
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9444
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: renders migrate pre-install/pre-upgrade hook Job with owner and app password secret mounts
    template: migrate-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-owner-secret
            mountPath: /run/secrets/db-owner
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-app-secret
            mountPath: /run/secrets/db-app
            readOnly: true

  - it: omits app password secret mount in migrate Job when manageAppRole is false
    template: migrate-job.yaml
    set:
      database.migrate.manageAppRole: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-app-secret
            mountPath: /run/secrets/db-app
            readOnly: true

  - it: renders least-privilege RBAC without pods/exec or pods/attach and supports target namespaces and Cilium mode
    template: rbac.yaml
    set:
      enforcement.mode: cilium
      clusterTargets.namespaces:
        - nativelink
        - forgejo
    asserts:
      - hasDocuments:
          count: 12
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: dark-factory-sandboxes
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["agents.x-k8s.io"]
            resources: ["sandboxes"]
            verbs: ["create", "get", "list", "watch", "patch", "delete"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["cilium.io"]
            resources: ["ciliumnetworkpolicies"]
            verbs: ["create", "get", "list", "watch", "patch", "delete"]
        documentIndex: 2
      - notContains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
        documentIndex: 4
      - equal:
          path: metadata.namespace
          value: nativelink
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["get", "list", "watch"]
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
        documentIndex: 6
      - equal:
          path: metadata.namespace
          value: forgejo
        documentIndex: 8
      - isKind:
          of: ClusterRole
        documentIndex: 10
      - equal:
          path: rules[0].resourceNames
          value: ["dark-factory-sandboxes"]
        documentIndex: 10

  - it: renders release-prefixed ClusterRole when clusterTargets.anyNamespace is true
    template: rbac.yaml
    release:
      name: inst-a
    set:
      clusterTargets.anyNamespace: true
    asserts:
      - hasDocuments:
          count: 10
      - isKind:
          of: ClusterRole
        documentIndex: 6
      - equal:
          path: metadata.name
          value: inst-a-dark-factory-cluster-targets-reader
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["get", "list", "watch"]
        documentIndex: 6

  - it: creates sandbox namespace objects when sandboxNamespace.create is true
    template: sandbox-namespace.yaml
    set:
      sandboxNamespace.create: true
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Namespace
        documentIndex: 0
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: restricted
        documentIndex: 0
      - isKind:
          of: NetworkPolicy
        documentIndex: 1
      - equal:
          path: metadata.name
          value: default-deny-all
        documentIndex: 1
      - isKind:
          of: ResourceQuota
        documentIndex: 2
      - isKind:
          of: LimitRange
        documentIndex: 3
      - isKind:
          of: ServiceAccount
        documentIndex: 4
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 4

  - it: renders no sandbox namespace objects when sandboxNamespace.create is false
    template: sandbox-namespace.yaml
    set:
      sandboxNamespace.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders gateway Deployment with >=2 replicas, automountServiceAccountToken false, PDB, Service, and headless Service
    templates:
      - gateway-deployment.yaml
      - gateway-service.yaml
    asserts:
      - isKind:
          of: Deployment
        template: gateway-deployment.yaml
      - equal:
          path: spec.replicas
          value: 2
        template: gateway-deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: gateway-deployment.yaml
      - isKind:
          of: PodDisruptionBudget
        template: gateway-service.yaml
        documentIndex: 0
      - isKind:
          of: Service
        template: gateway-service.yaml
        documentIndex: 1
      - isKind:
          of: Service
        template: gateway-service.yaml
        documentIndex: 2
      - equal:
          path: spec.clusterIP
          value: None
        template: gateway-service.yaml
        documentIndex: 2

  - it: renders instance NetworkPolicies restricting control-plane and gateway ingress
    template: netpol.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
        documentIndex: 0
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9443
        documentIndex: 0
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9444
        documentIndex: 0
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 8080
        documentIndex: 0
      - isKind:
          of: NetworkPolicy
        documentIndex: 1
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3128
        documentIndex: 1
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9444
        documentIndex: 1

  - it: renders the CA in the cert-manager namespace behind a ClusterIssuer and issues all Certificates from it
    template: certs.yaml
    release:
      name: df
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Issuer
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: cert-manager
        documentIndex: 0
      - isNotNull:
          path: spec.selfSigned
        documentIndex: 0
      - isKind:
          of: Certificate
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: cert-manager
        documentIndex: 1
      - equal:
          path: spec.isCA
          value: true
        documentIndex: 1
      - equal:
          path: spec.secretName
          value: NAMESPACE-df-dark-factory-ca-key-pair
        documentIndex: 1
      - isKind:
          of: ClusterIssuer
        documentIndex: 2
      - notExists:
          path: metadata.namespace
        documentIndex: 2
      - equal:
          path: metadata.name
          value: NAMESPACE-df-dark-factory-ca-issuer
        documentIndex: 2
      - equal:
          path: spec.ca.secretName
          value: NAMESPACE-df-dark-factory-ca-key-pair
        documentIndex: 2
      - equal:
          path: spec.issuerRef
          value:
            name: NAMESPACE-df-dark-factory-ca-issuer
            kind: ClusterIssuer
            group: cert-manager.io
        documentIndex: 3
      - equal:
          path: spec.secretName
          value: df-dark-factory-control-plane-tls
        documentIndex: 3
      - contains:
          path: spec.dnsNames
          content: df-dark-factory-control-plane.NAMESPACE.svc
        documentIndex: 3
      - equal:
          path: spec.issuerRef.name
          value: NAMESPACE-df-dark-factory-ca-issuer
        documentIndex: 4
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
        documentIndex: 4
      - equal:
          path: spec.secretName
          value: df-dark-factory-gateway-tls
        documentIndex: 4
      - contains:
          path: spec.dnsNames
          content: "*.df-dark-factory-gateway-headless.NAMESPACE.svc.cluster.local"
        documentIndex: 4

  - it: places the CA in a configurable cluster resource namespace
    template: certs.yaml
    set:
      tls.ca.clusterResourceNamespace: certs
    asserts:
      - equal:
          path: metadata.namespace
          value: certs
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: certs
        documentIndex: 1

  - it: configures the gateway link and flow buffer in the release config
    template: configmap.yaml
    release:
      name: df
      namespace: dark-factory
    set:
      gateway.blockedCidrs: ["10.42.0.0/16"]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'controlPlaneHost: "df-dark-factory-control-plane"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'identity: "df-dark-factory-gateway"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'headlessService: "df-dark-factory-gateway-headless.dark-factory.svc"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'bufferSize: 10000'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'bufferMaxAgeSeconds: 3600'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'blockedCidrs: \["10.42.0.0/16"\]'
        documentIndex: 0

  - it: renders no auth section until oidc.publicUrl is set
    template: configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'auth:'
        documentIndex: 0

  - it: configures the web UI login when oidc.publicUrl is set
    template: configmap.yaml
    set:
      oidc.publicUrl: https://factory.example.org
      oidc.rolesClaim: groups
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'publicUrl: "https://factory.example.org"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'clientSecretFile: /run/secrets/oidc/client-secret'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rolesClaim: "groups"'
        documentIndex: 0
      - notMatchRegex:
          path: data["migrate-config.yaml"]
          pattern: 'auth:'
        documentIndex: 1

  - it: requests the extra OIDC scopes when oidc.extraScopes is set
    template: configmap.yaml
    set:
      oidc.publicUrl: https://factory.example.org
      oidc.extraScopes: [groups, offline_access]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'extraScopes: \["groups","offline_access"\]'
        documentIndex: 0

  - it: renders no extraScopes by default
    template: configmap.yaml
    set:
      oidc.publicUrl: https://factory.example.org
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'extraScopes'
        documentIndex: 0

  - it: points sandbox certificates at the same issuer the chart renders
    template: configmap.yaml
    release:
      name: df
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "NAMESPACE-df-dark-factory-ca-issuer"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerKind: "ClusterIssuer"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'anyNamespace: false'
        documentIndex: 0

  - it: refuses a namespaced Issuer for sandbox certificates
    template: gateway-deployment.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: Issuer
    asserts:
      - failedTemplate:
          errorPattern: sandbox certificates need a ClusterIssuer

  - it: accepts a namespaced Issuer for the control plane when sandboxes get a ClusterIssuer
    template: configmap.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: Issuer
      sandboxNamespace.issuerName: sandbox-ca
      sandboxNamespace.issuerKind: ClusterIssuer
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "sandbox-ca"'
        documentIndex: 0

  - it: points sandbox certificates at an existing issuer when tls.ca.create is false
    template: configmap.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: ClusterIssuer
      clusterTargets.namespaces: [forgejo, nativelink]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'issuerName: "homelab-ca"'
        documentIndex: 0
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'namespaces: \["forgejo","nativelink"\]'
        documentIndex: 0

  - it: issues Certificates from an existing issuer when tls.ca.create is false
    template: certs.yaml
    set:
      tls.ca.create: false
      tls.ca.existingIssuer.name: homelab-ca
      tls.ca.existingIssuer.kind: ClusterIssuer
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef
          value:
            name: homelab-ca
            kind: ClusterIssuer
            group: cert-manager.io

  - it: renders no HTTPRoute by default
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the configured hostnames to the control plane UI port
    template: httproute.yaml
    release:
      name: df
      namespace: factory
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: public
          namespace: gateway-system
      httpRoute.hostnames:
        - factory.example.org
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.namespace
          value: factory
      - equal:
          path: spec.parentRefs
          value:
            - name: public
              namespace: gateway-system
      - equal:
          path: spec.hostnames
          value:
            - factory.example.org
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: df-dark-factory-control-plane
              port: 8080

  - it: opens the UI port to every source when networkPolicy.ingressController.allowAll is set
    template: netpol.yaml
    set:
      networkPolicy.ingressController.allowAll: true
    asserts:
      - notExists:
          path: spec.ingress[2].from
        documentIndex: 0
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 8080
        documentIndex: 0
      - exists:
          path: spec.ingress[0].from
        documentIndex: 0
      - exists:
          path: spec.ingress[1].from
        documentIndex: 0

  - it: passes image.runtime as the sandbox runtime image to the control plane
    template: configmap.yaml
    set:
      image.runtime.repository: registry.example.org/runtime
      image.runtime.tag: dev
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runtimeImage: "registry.example.org/runtime:dev"'
        documentIndex: 0

  - it: prefers image.runtime.digest over the tag for the sandbox runtime image
    template: configmap.yaml
    set:
      image.runtime.tag: dev
      image.runtime.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runtimeImage: "ghcr.io/prskr/dark-factory/runtime@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
        documentIndex: 0

  - it: renders the keep-alive window of runs
    template: configmap.yaml
    set:
      runs.keepAliveSeconds: 120
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runs:\n  keepAliveSeconds: 120\n'
        documentIndex: 0

  - it: defaults the keep-alive window to 10 minutes
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runs:\n  keepAliveSeconds: 600\n'
        documentIndex: 0

  - it: allows only https to the forge by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'forge:\n  allowPlainHttp: false\n'
        documentIndex: 0

  - it: renders forge.allowPlainHttp
    template: configmap.yaml
    set:
      forge.allowPlainHttp: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'forge:\n  allowPlainHttp: true\n'
        documentIndex: 0

  - it: hides hidden transcript blocks by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'web:\n  showHiddenBlocks: false\n'
        documentIndex: 0

  - it: renders web.showHiddenBlocks
    template: configmap.yaml
    set:
      web.showHiddenBlocks: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'web:\n  showHiddenBlocks: true\n'
        documentIndex: 0

  - it: renders the harness image from tag and repository
    template: configmap.yaml
    set:
      image.harness.claudeCode.repository: registry.example.org/claude-harness
      image.harness.claudeCode.tag: 0.95.0
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'harness:\n  claudeCode:\n    image: "registry.example.org/claude-harness:0.95.0"'
        documentIndex: 0

  - it: prefers image.harness.claudeCode.digest over the tag
    template: configmap.yaml
    set:
      image.harness.claudeCode.repository: registry.example.org/claude-harness
      image.harness.claudeCode.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'image: "registry.example.org/claude-harness@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
        documentIndex: 0

  - it: requires a harness image tag or digest
    # the config checksum in the gateway Deployment renders the config first, so it fails there
    template: gateway-deployment.yaml
    set:
      image.harness.claudeCode.tag: ''
      image.harness.claudeCode.digest: ''
    asserts:
      - failedTemplate:
          errorPattern: image.harness.claudeCode.tag or .digest is required

  - it: has no runtime delivery setting
    template: configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'runtimeDelivery'
        documentIndex: 0

  - it: rejects an unknown logging.format
    template: control-plane-deployment.yaml
    set:
      logging.format: logfmt
    asserts:
      - failedTemplate: {}

  - it: logs as text at info by default
    template: control-plane-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DF_LOG_FORMAT
            value: text
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info

  - it: sets JSON logging on the control plane, gateway and migrate containers
    set:
      logging.format: json
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DF_LOG_FORMAT
            value: json
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DF_LOG_FORMAT
            value: json
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DF_LOG_FORMAT
            value: json
        template: migrate-job.yaml

  - it: sets the gateway log level independently of the control plane
    set:
      gateway.logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: debug
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info
        template: control-plane-deployment.yaml

  - it: sets the control plane log level on the control plane and migrate containers
    set:
      controlPlane.logLevel: warn
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: warn
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: warn
        template: migrate-job.yaml

  - it: renders the sandbox log level into the instance config
    template: configmap.yaml
    set:
      sandbox.logLevel: debug
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'logLevel: "debug"'
        documentIndex: 0

  - it: rejects enabled traces without an OTLP endpoint
    template: control-plane-deployment.yaml
    set:
      telemetry.traces.enabled: true
    asserts:
      - failedTemplate: {}

  - it: rejects an otlp metrics exporter without an OTLP endpoint
    template: control-plane-deployment.yaml
    set:
      telemetry.metrics.exporters: [otlp]
    asserts:
      - failedTemplate: {}

  - it: rejects an OTLP protocol other than grpc
    template: control-plane-deployment.yaml
    set:
      telemetry.otlp.protocol: http/protobuf
    asserts:
      - failedTemplate: {}

  - it: renders Prometheus metrics and no tracing by default
    set:
      fullnameOverride: df
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: prometheus
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: prometheus
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
            value: none
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
            value: none
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_PROMETHEUS_PORT
            value: "9464"
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: dark-factory-control-plane
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: dark-factory-gateway
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9464
            protocol: TCP
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9464
            protocol: TCP
        template: gateway-deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "OTEL_EXPORTER_OTLP_ENDPOINT")]
        template: control-plane-deployment.yaml

  - it: exposes the metrics port on the control plane and gateway Services
    set:
      telemetry.metrics.port: 9100
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9100
            targetPort: metrics
            protocol: TCP
        template: control-plane-service.yaml
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9100
            targetPort: metrics
            protocol: TCP
        template: gateway-service.yaml
        documentIndex: 1

  - it: reads OTLP auth headers from a Secret and exposes no metrics port with only the otlp exporter
    set:
      telemetry.metrics.exporters: [otlp]
      telemetry.otlp.endpoint: https://otel.example.org:4317
      telemetry.otlp.headersSecret: otel-auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: otlp
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: https://otel.example.org:4317
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
            valueFrom:
              secretKeyRef:
                name: otel-auth
                key: headers
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
            valueFrom:
              secretKeyRef:
                name: otel-auth
                key: headers
        template: gateway-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9464
            protocol: TCP
        template: control-plane-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9464
            protocol: TCP
        template: gateway-deployment.yaml
      - notContains:
          path: spec.ports
          content:
            name: metrics
            port: 9464
            targetPort: metrics
            protocol: TCP
        template: control-plane-service.yaml

  - it: enables tracing with the sampler and the OTLP settings
    set:
      telemetry.traces.enabled: true
      telemetry.traces.sampler: traceidratio
      telemetry.traces.samplerArg: "0.1"
      telemetry.otlp.endpoint: otel.example.org:4317
      telemetry.otlp.insecure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_EXPORTER
            value: otlp
        template: control-plane-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_SAMPLER
            value: traceidratio
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
        template: gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
        template: control-plane-deployment.yaml

  - it: renders no ServiceMonitor by default
    template: servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor per component with the configured labels and interval
    template: servicemonitor.yaml
    set:
      telemetry.metrics.serviceMonitor.enabled: true
      telemetry.metrics.serviceMonitor.labels:
        release: prometheus
      telemetry.metrics.serviceMonitor.interval: 30s
      networkPolicy.metricsScraper.namespaceSelector:
        kubernetes.io/metadata.name: monitoring
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.labels.release
          value: prometheus
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: control-plane
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: gateway
        documentIndex: 1

  - it: renders no ServiceMonitor when Prometheus is not an exporter
    template: servicemonitor.yaml
    set:
      telemetry.metrics.serviceMonitor.enabled: true
      telemetry.metrics.exporters: []
    asserts:
      - hasDocuments:
          count: 0

  - it: allows the metrics scraper to reach the metrics port of the control plane and gateway
    template: netpol.yaml
    set:
      networkPolicy.metricsScraper.namespaceSelector:
        kubernetes.io/metadata.name: monitoring
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - protocol: TCP
                port: 9464
        documentIndex: 0
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - protocol: TCP
                port: 9464
        documentIndex: 1

  - it: adds no scraper ingress rule without a scraper namespace selector
    template: netpol.yaml
    asserts:
      - notContains:
          path: spec.ingress
          content:
            ports:
              - protocol: TCP
                port: 9464
        any: true

  - it: refuses a metrics scraper in the sandbox namespace
    template: netpol.yaml
    set:
      networkPolicy.metricsScraper.namespaceSelector:
        kubernetes.io/metadata.name: dark-factory-sandboxes
    asserts:
      - failedTemplate:
          errorPattern: must not select the sandbox namespace

  - it: refuses a ServiceMonitor without a scraper namespace selector
    template: servicemonitor.yaml
    set:
      telemetry.metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: serviceMonitor.enabled requires networkPolicy.metricsScraper.namespaceSelector

  - it: accepts a ServiceMonitor without a selector when the NetworkPolicy is off
    template: servicemonitor.yaml
    set:
      telemetry.metrics.serviceMonitor.enabled: true
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: mounts the Forgejo and GitHub plugin images of the app version read-only by default
    template: control-plane-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: plugin-forgejo
            image:
              reference: ghcr.io/prskr/dark-factory/plugin-forgejo:0.1.0
              pullPolicy: IfNotPresent
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: plugin-forgejo
            mountPath: /plugins/forgejo
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: plugin-github
            image:
              reference: ghcr.io/prskr/dark-factory/plugin-github:0.1.0
              pullPolicy: IfNotPresent
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: plugin-github
            mountPath: /plugins/github
            readOnly: true

  - it: references the plugin image by digest when one is pinned
    template: control-plane-deployment.yaml
    set:
      plugins.forgejo.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: plugin-forgejo
            image:
              reference: ghcr.io/prskr/dark-factory/plugin-forgejo@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              pullPolicy: IfNotPresent

  - it: renders no plugin volume and no plugin mount for a plugin without an image
    template: control-plane-deployment.yaml
    values:
      - values/plugin-baked-in.yaml
    asserts:
      # config, db-app, oidc and tls only; the default release adds the two plugin volumes
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 4
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 4

  - it: rejects a plugin name that is not a lowercase DNS label
    # the values schema rejects the name before any template renders
    template: gateway-deployment.yaml
    set:
      plugins.My_Plugin.path: /custom/plugin.wasm
    asserts:
      - failedTemplate:
          errorPattern: "invalid propertyName 'My_Plugin'"

  - it: writes the custom plugin path and settings into the config
    template: configmap.yaml
    documentIndex: 0
    values:
      - values/plugin-baked-in.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'path: "/custom/forgejo.wasm"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'settings: \{"wip-prefixes":"WIP:"\}'

  - it: writes the routing hosts and auth scheme of a plugin into the config
    template: configmap.yaml
    documentIndex: 0
    values:
      - values/plugin-routing.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '  "github":\n    path: "/custom/github.wasm"\n    callTimeoutSeconds: 30\n    memoryMib: 64\n    settings: \{\}\n    hosts: \[\{"apiUrl":"https://api.github.com","host":"github.com"\},\{"apiUrl":"https://ghe.example.org/api/v3","host":"ghe.example.org"\},"ghe.example.net"\]\n    authScheme: "bearer"'

  - it: keeps Forgejo the default plugin and routes github.com to GitHub by default
    template: configmap.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'plugins:\n  "forgejo":\n    path: "/plugins/forgejo/plugin.wasm"\n    callTimeoutSeconds: 30\n    memoryMib: 64\n    settings: \{\}\n  "github":\n    path: "/plugins/github/plugin.wasm"\n    callTimeoutSeconds: 30\n    memoryMib: 64\n    settings: \{\}\n    hosts: \[\{"apiUrl":"https://api.github.com","host":"github.com"\}\]\n    authScheme: "bearer"\n'

  - it: renders no GitHub plugin volume when the entry is removed
    template: control-plane-deployment.yaml
    values:
      - values/plugin-github-removed.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: plugin-github
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: plugin-github
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: plugin-forgejo
          any: true

  - it: writes no GitHub plugin config when the entry is removed
    template: configmap.yaml
    documentIndex: 0
    values:
      - values/plugin-github-removed.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: '"github"|hosts:|authScheme:'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '  "forgejo":\n    path: "/plugins/forgejo/plugin.wasm"'

  - it: rejects an unknown plugin auth scheme
    # the values schema rejects the value before any template renders
    template: configmap.yaml
    set:
      plugins.forgejo.authScheme: basic
    asserts:
      - failedTemplate:
          errorPattern: "authScheme"

  - it: rejects a plugin host route without an https API URL
    template: configmap.yaml
    set:
      plugins.forgejo.hosts:
        - host: github.com
          apiUrl: http://api.github.com
    asserts:
      - failedTemplate:
          errorPattern: "hosts"

  - it: rejects a plugin host route with an unknown key
    template: configmap.yaml
    set:
      plugins.forgejo.hosts:
        - host: github.com
          api: https://api.github.com
    asserts:
      - failedTemplate:
          errorPattern: "hosts"

  - it: rejects a plugin host route without an API URL
    template: configmap.yaml
    set:
      plugins.forgejo.hosts:
        - host: github.com
    asserts:
      - failedTemplate:
          errorPattern: "hosts"

  - it: rejects a plugin entry that has neither an image nor a path
    # the values schema rejects the entry before any template renders
    template: control-plane-deployment.yaml
    values:
      - values/plugin-without-image-or-path.yaml
    asserts:
      - failedTemplate:
          errorPattern: "at '/plugins/forgejo': 'anyOf' failed"

  - it: puts the configured plugin tag into the image volume reference of the pod template
    template: control-plane-deployment.yaml
    set:
      plugins.forgejo.image.tag: 0.2.0
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: plugin-forgejo
            image:
              reference: ghcr.io/prskr/dark-factory/plugin-forgejo:0.2.0
              pullPolicy: IfNotPresent
