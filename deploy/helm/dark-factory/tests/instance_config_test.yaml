suite: Dark Factory Helm Chart - routes and instance config
templates:
  - configmap.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  - migrate-job.yaml
  - rbac.yaml
  - sandbox-namespace.yaml
  - certs.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - netpol.yaml
  - httproute.yaml
  - servicemonitor.yaml
tests:
  - it: renders no HTTPRoute by default
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the configured hostnames to the control plane UI port
    template: httproute.yaml
    release:
      name: df
      namespace: factory
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: public
          namespace: gateway-system
      httpRoute.hostnames:
        - factory.example.org
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.namespace
          value: factory
      - equal:
          path: spec.parentRefs
          value:
            - name: public
              namespace: gateway-system
      - equal:
          path: spec.hostnames
          value:
            - factory.example.org
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: df-dark-factory-control-plane
              port: 8080

  - it: opens the UI port to every source when networkPolicy.ingressController.allowAll is set
    template: netpol.yaml
    set:
      networkPolicy.ingressController.allowAll: true
    asserts:
      - notExists:
          path: spec.ingress[2].from
        documentIndex: 0
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 8080
        documentIndex: 0
      - exists:
          path: spec.ingress[0].from
        documentIndex: 0
      - exists:
          path: spec.ingress[1].from
        documentIndex: 0

  - it: passes image.runtime as the sandbox runtime image to the control plane
    template: configmap.yaml
    set:
      image.runtime.repository: registry.example.org/runtime
      image.runtime.tag: dev
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runtimeImage: "registry.example.org/runtime:dev"'
        documentIndex: 0

  - it: prefers image.runtime.digest over the tag for the sandbox runtime image
    template: configmap.yaml
    set:
      image.runtime.tag: dev
      image.runtime.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runtimeImage: "ghcr.io/prskr/dark-factory/runtime@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
        documentIndex: 0

  - it: renders the keep-alive window of runs
    template: configmap.yaml
    set:
      runs.keepAliveSeconds: 120
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runs:\n  keepAliveSeconds: 120\n'
        documentIndex: 0

  - it: defaults the keep-alive window to 10 minutes
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'runs:\n  keepAliveSeconds: 600\n'
        documentIndex: 0

  - it: renders the concurrency limit and the resume cap of runs
    template: configmap.yaml
    set:
      runs.maxConcurrent: 2
      runs.maxAutoResumes: 5
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'maxConcurrent: 2\n  maxAutoResumes: 5\n'
        documentIndex: 0

  - it: renders the volume retention values
    template: configmap.yaml
    set:
      volumes.retainAfterCloseSeconds: 3600
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'volumes:\n  retainAfterCloseSeconds: 3600\n  idleTtlSeconds: 2592000\n'
        documentIndex: 0

  - it: renders a configured idle volume TTL
    template: configmap.yaml
    set:
      volumes.idleTtlSeconds: 86400
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'volumes:\n  retainAfterCloseSeconds: 604800\n  idleTtlSeconds: 86400\n'
        documentIndex: 0

  - it: renders the largest accepted volume retention exactly
    template: configmap.yaml
    set:
      volumes.idleTtlSeconds: 9007199254740991
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'idleTtlSeconds: 9007199254740991\n'
        documentIndex: 0

  - it: rejects a volume retention beyond the accepted range
    template: configmap.yaml
    set:
      volumes.retainAfterCloseSeconds: 10000000000000000000
    asserts:
      - failedTemplate: {}

  - it: allows only https to upstreams by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'network:\n  allowPlainHttp: false\n'
        documentIndex: 0

  - it: renders network.allowPlainHttp
    template: configmap.yaml
    set:
      network.allowPlainHttp: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'network:\n  allowPlainHttp: true\n'
        documentIndex: 0

  - it: hides hidden transcript blocks by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'web:\n  showHiddenBlocks: false\n'
        documentIndex: 0

  - it: renders web.showHiddenBlocks
    template: configmap.yaml
    set:
      web.showHiddenBlocks: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'web:\n  showHiddenBlocks: true\n'
        documentIndex: 0

  - it: renders the default code themes
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'web:\n  showHiddenBlocks: false\n  codeTheme:\n    light: "InspiredGitHub"\n    dark: "base16-ocean.dark"\n'
        documentIndex: 0

  - it: quotes code theme names with spaces
    template: configmap.yaml
    set:
      web.codeTheme.light: Solarized (light)
      web.codeTheme.dark: Solarized (dark)
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '    light: "Solarized \(light\)"\n    dark: "Solarized \(dark\)"\n'
        documentIndex: 0

  - it: rejects a code theme that is not bundled
    template: configmap.yaml
    set:
      web.codeTheme.light: Monokai
    asserts:
      - failedTemplate:
          errorPattern: codeTheme

  - it: renders the harness image from tag and repository
    template: configmap.yaml
    set:
      image.harness.claudeCode.repository: registry.example.org/claude-harness
      image.harness.claudeCode.tag: 0.95.0
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'harness:\n  claudeCode:\n    image: "registry.example.org/claude-harness:0.95.0"'
        documentIndex: 0

  - it: prefers image.harness.claudeCode.digest over the tag
    template: configmap.yaml
    set:
      image.harness.claudeCode.repository: registry.example.org/claude-harness
      image.harness.claudeCode.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'image: "registry.example.org/claude-harness@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
        documentIndex: 0

  - it: renders the OpenCode harness image from tag and repository
    template: configmap.yaml
    set:
      image.harness.opencode.repository: registry.example.org/opencode-harness
      image.harness.opencode.tag: 2.2.5
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'harness:\n  claudeCode:\n    image: "[^"]+"\n  opencode:\n    image: "registry.example.org/opencode-harness:2.2.5"'
        documentIndex: 0

  - it: prefers image.harness.opencode.digest over the tag
    template: configmap.yaml
    set:
      image.harness.opencode.repository: registry.example.org/opencode-harness
      image.harness.opencode.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'opencode:\n    image: "registry.example.org/opencode-harness@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
        documentIndex: 0

  - it: requires an OpenCode harness image tag or digest
    template: gateway-deployment.yaml
    set:
      image.harness.opencode.tag: ''
      image.harness.opencode.digest: ''
    asserts:
      - failedTemplate:
          errorPattern: image.harness.opencode.tag or .digest is required

  - it: requires a harness image tag or digest
    # the config checksum in the gateway Deployment renders the config first, so it fails there
    template: gateway-deployment.yaml
    set:
      image.harness.claudeCode.tag: ''
      image.harness.claudeCode.digest: ''
    asserts:
      - failedTemplate:
          errorPattern: image.harness.claudeCode.tag or .digest is required

  - it: has no runtime delivery setting
    template: configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'runtimeDelivery'
        documentIndex: 0

  - it: renders the artifact limits with their defaults
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'artifacts:\n  maxTextBytes: 1048576\n  maxImageBytes: 3932160\n  maxPerTask: 50\n'
        documentIndex: 0

  - it: renders the scheduling waits with their defaults
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'scheduling:\n  tickMillis: 5000\n  resumeBackoffSeconds: 120\n  forgeRetryBaseSeconds: 30\n'
        documentIndex: 0

  - it: renders configured scheduling waits into the instance config
    template: configmap.yaml
    set:
      scheduling.tickMillis: 500
      scheduling.resumeBackoffSeconds: 5
      scheduling.forgeRetryBaseSeconds: 2
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'scheduling:\n  tickMillis: 500\n  resumeBackoffSeconds: 5\n  forgeRetryBaseSeconds: 2\n'
        documentIndex: 0

  - it: rejects a scheduler tick of zero
    template: configmap.yaml
    set:
      scheduling.tickMillis: 0
    asserts:
      - failedTemplate:
          errorPattern: tickMillis

  - it: rejects a resume backoff above the limit
    template: configmap.yaml
    set:
      scheduling.resumeBackoffSeconds: 3601
    asserts:
      - failedTemplate:
          errorPattern: resumeBackoffSeconds

  - it: rejects an unknown scheduling key
    template: configmap.yaml
    set:
      scheduling.tickSeconds: 1
    asserts:
      - failedTemplate:
          errorPattern: tickSeconds

  - it: rejects an image limit above the runtime cap
    template: configmap.yaml
    set:
      artifacts.maxImageBytes: 10485760
    asserts:
      - failedTemplate:
          errorPattern: maxImageBytes

  - it: enforces Landlock in the instance config by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^  landlock: "enforce"$'
        documentIndex: 0

  - it: renders the Landlock opt-out into the instance config
    template: configmap.yaml
    set:
      sandbox.landlock: disabled
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^  landlock: "disabled"$'
        documentIndex: 0

  - it: rejects a Landlock mode other than enforce and disabled
    template: configmap.yaml
    set:
      sandbox.landlock: best-effort
    asserts:
      - failedTemplate: {}
