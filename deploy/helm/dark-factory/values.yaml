# Default values for dark-factory.
nameOverride: ''
fullnameOverride: ''

instanceName: 'dark-factory'

image:
  pullPolicy: IfNotPresent
  pullSecrets: []
  controlPlane:
    repository: ghcr.io/prskr/dark-factory/control-plane
    tag: '0.1.0'
    digest: ''
  runtime:
    repository: ghcr.io/prskr/dark-factory/runtime
    tag: '0.1.0'
    digest: ''
  testProject:
    repository: ghcr.io/prskr/dark-factory/test-project
    tag: '0.1.0'
    digest: ''

database:
  host: postgres.default.svc
  port: 5432
  database: dark_factory
  schema: dark_factory
  maxConnections: 16
  app:
    user: dark_factory_app
    existingSecret: dark-factory-db-app
    passwordKey: password
  owner:
    user: dark_factory_owner
    existingSecret: dark-factory-db-owner
    passwordKey: password
  migrate:
    manageAppRole: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

oidc:
  issuerUrl: https://id.example.com/realms/dark-factory
  clientId: dark-factory
  existingSecret: dark-factory-oidc
  clientSecretKey: client-secret
  # Externally visible base URL of the UI, e.g. https://factory.example.org. The redirect URI
  # registered in the OIDC provider is <publicUrl>/auth/callback. Empty: no `auth` section is
  # rendered: `serve` logs a warning and mounts only /healthz, /readyz and /assets/* (no web UI).
  publicUrl: ''
  # Token claim holding a flat list of roles; the UI requires `board-member` in it.
  rolesClaim: roles

logging:
  # text | json. Applies to the control plane, gateway and migrate job; the control plane passes
  # its own format on to every sandbox.
  format: text

telemetry:
  metrics:
    # prometheus (scrape endpoint on `port`), otlp (push); [] disables metrics. Applies to the
    # control plane and gateway.
    exporters: [prometheus]
    port: 9464
    serviceMonitor:
      # Requires the prometheus-operator CRDs and `prometheus` in `exporters`. With the NetworkPolicy
      # on, also set `networkPolicy.metricsScraper.namespaceSelector` (the render fails otherwise).
      enabled: false
      # Labels the Prometheus instance selects ServiceMonitors by, e.g. {release: prometheus}.
      labels: {}
      # Scrape interval; empty: the Prometheus default.
      interval: ''
  traces:
    # Export spans over OTLP; needs `otlp.endpoint`.
    enabled: false
    # OTEL_TRACES_SAMPLER and OTEL_TRACES_SAMPLER_ARG (empty: unset).
    sampler: parentbased_always_on
    samplerArg: ''
  otlp:
    # OTEL_EXPORTER_OTLP_ENDPOINT; required with the otlp exporter or enabled traces.
    endpoint: ''
    # gRPC only.
    protocol: grpc
    # Plaintext connection (OTEL_EXPORTER_OTLP_INSECURE).
    insecure: false
    # Secret in the release namespace with key `headers` (e.g. `authorization=Bearer ...`),
    # exported as OTEL_EXPORTER_OTLP_HEADERS.
    headersSecret: ''

sandbox:
  # RUST_LOG (EnvFilter syntax) of the sandbox runtime; rendered as sandbox.logLevel in the
  # instance config.
  logLevel: info

sandboxNamespace:
  create: true
  name: dark-factory-sandboxes
  # Empty: the cluster's default runtime. Set to e.g. "kata" for microVM isolation.
  runtimeClassName: ''
  serviceAccountName: dark-factory-sandbox
  # Empty: the cluster's default StorageClass.
  storageClass: ''
  pvcSize: '20Gi'
  # Issuer for sandbox client certificates; empty follows the chart's issuer (`tls.ca`).
  # Must be a ClusterIssuer: sandbox certificates are requested from the sandbox namespace.
  issuerName: ''
  issuerKind: ''
  issuerGroup: 'cert-manager.io'
  certificateDuration: '6h'
  certificateRenewBefore: '2h'
  runtimeDelivery: 'imageVolume'
  clusterDomain: 'cluster.local'
  controlPlaneIp: ''
  gatewayIp: ''
  resourceQuota:
    pods: '20'
    requestsCpu: '16'
    requestsMemory: '32Gi'
    limitsCpu: '32'
    limitsMemory: '64Gi'
    requestsStorage: '200Gi'
    persistentVolumeClaims: '40'
  limitRange:
    defaultCpu: '2'
    defaultMemory: '4Gi'
    defaultRequestCpu: '250m'
    defaultRequestMemory: '512Mi'

enforcement:
  mode: kubernetes

clusterTargets:
  anyNamespace: false
  namespaces: []

controlPlane:
  replicas: 1
  # RUST_LOG (EnvFilter syntax) of the control plane and the migrate job.
  logLevel: info
  serviceAccountName: ''
  ports:
    http: 8080
    agent: 9443
    internalGrpc: 9444
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

gateway:
  replicas: 2
  # RUST_LOG (EnvFilter syntax) of the gateway.
  logLevel: info
  serviceAccountName: ''
  pdb:
    minAvailable: 1
  ports:
    proxy: 3128
    internalGrpc: 9444
    health: 8080
  # Flow events of the live egress log kept in memory per gateway pod.
  bufferSize: 10000
  # Pod and Service CIDRs of the cluster that the proxy must never connect to, on top of the
  # built-in private, loopback, link-local, CGNAT and unique-local ranges.
  blockedCidrs: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

tls:
  ca:
    # Create a private CA and a ClusterIssuer for it. The CA Certificate and its bootstrap Issuer
    # are created in `clusterResourceNamespace`, because a CA ClusterIssuer reads its key pair
    # from there. The installing user needs permission to create cert-manager resources in it.
    create: true
    # cert-manager's cluster resource namespace (`--cluster-resource-namespace`, default
    # `cert-manager`). Not the release namespace: a CA ClusterIssuer can only read its Secret
    # from here, and sandboxes need a ClusterIssuer (the sandbox namespace holds no Secrets and
    # their certificate requests are created there). Setting this to the release namespace only
    # works if cert-manager runs with `--cluster-resource-namespace=<release namespace>`.
    clusterResourceNamespace: cert-manager
    # Used when `create` is false. Sandboxes need a ClusterIssuer.
    existingIssuer:
      name: ''
      kind: ClusterIssuer
  duration: 2160h
  renewBefore: 360h

# Gateway API HTTPRoute to the control plane UI. Requires the Gateway API CRDs and an existing
# Gateway. Also set oidc.publicUrl to the route's URL and allow the Gateway's namespace in
# networkPolicy.ingressController.
httpRoute:
  enabled: false
  # Gateways to attach to, e.g. [{name: public, namespace: gateway-system}]. Required when enabled.
  parentRefs: []
  # Hostnames the route matches; empty: all hostnames of the listener.
  hostnames: []

networkPolicy:
  enabled: true
  ingressController:
    # Allow every source to reach the UI port; the selectors below are then ignored. Needed when
    # the proxy's traffic has no pod identity, e.g. Cilium Gateway API/Ingress (reserved:ingress).
    allowAll: false
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector: {}
  # Allow this scraper to reach the metrics port of the control plane and the gateway. Empty
  # namespaceSelector: no rule. Selecting the sandbox namespace
  # (`kubernetes.io/metadata.name: <sandboxNamespace.name>`) fails the render: sandboxes must never
  # reach the metrics port. Only that label is checked; other labels shared with the sandbox
  # namespace are not (its default-deny egress still blocks sandboxes).
  metricsScraper:
    namespaceSelector: {}
    podSelector: {}
