apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dark-factory.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ .Values.gateway.pdb.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "dark-factory.gateway.selectorLabels" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dark-factory.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "dark-factory.gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.gateway.ports.proxy }}
      targetPort: proxy
      protocol: TCP
    - name: git
      port: {{ .Values.gateway.ports.git }}
      targetPort: git
      protocol: TCP
    - name: internal-grpc
      port: {{ .Values.gateway.ports.internalGrpc }}
      targetPort: internal-grpc
      protocol: TCP
    {{- if include "dark-factory.telemetry.prometheus" . }}
    - name: metrics
      port: {{ .Values.telemetry.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dark-factory.fullname" . }}-gateway-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "dark-factory.gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: internal-grpc
      port: {{ .Values.gateway.ports.internalGrpc }}
      targetPort: internal-grpc
      protocol: TCP
