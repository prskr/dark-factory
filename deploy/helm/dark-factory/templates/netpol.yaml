{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dark-factory.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  podSelector:
    matchLabels:
      {{- include "dark-factory.controlPlane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sandboxNamespace.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.controlPlane.ports.agent }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "dark-factory.gateway.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.controlPlane.ports.internalGrpc }}
    {{- if .Values.networkPolicy.ingressController.allowAll }}
    {{- /* No `from`: every source, including identities no selector can name (Cilium reserved:ingress). */}}
    - ports:
    {{- else }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
          {{- if .Values.networkPolicy.ingressController.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 14 }}
          {{- end }}
      ports:
    {{- end }}
        - protocol: TCP
          port: {{ .Values.controlPlane.ports.http }}
    {{- include "dark-factory.netpol.scraper" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dark-factory.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      {{- include "dark-factory.gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sandboxNamespace.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.ports.proxy }}
        - protocol: TCP
          port: {{ .Values.gateway.ports.git }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "dark-factory.controlPlane.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.ports.internalGrpc }}
    {{- include "dark-factory.netpol.scraper" . | nindent 4 }}
{{- end }}
