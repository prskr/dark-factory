apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dark-factory.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "dark-factory.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "dark-factory.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "dark-factory.gateway.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "dark-factory.controlPlane.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DF_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: RUST_LOG
              value: {{ .Values.gateway.logLevel | quote }}
            {{- include "dark-factory.telemetry.env" (dict "ctx" . "component" "gateway") | nindent 12 }}
          args:
            - "--config"
            - "/etc/dark-factory/config.yaml"
            - "gateway"
          ports:
            - name: proxy
              containerPort: {{ .Values.gateway.ports.proxy }}
              protocol: TCP
            - name: git
              containerPort: {{ .Values.gateway.ports.git }}
              protocol: TCP
            - name: internal-grpc
              containerPort: {{ .Values.gateway.ports.internalGrpc }}
              protocol: TCP
            {{- if include "dark-factory.telemetry.prometheus" . }}
            - name: metrics
              containerPort: {{ .Values.telemetry.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: {{ .Values.gateway.ports.health }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dark-factory
              readOnly: true
            - name: tls
              mountPath: /etc/dark-factory/tls
              readOnly: true
            - name: git-mirrors
              mountPath: {{ include "dark-factory.gateway.mirrorDir" . }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dark-factory.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tls
          secret:
            secretName: {{ include "dark-factory.fullname" . }}-gateway-tls
        - name: git-mirrors
          emptyDir:
            sizeLimit: {{ .Values.gateway.git.mirrorSizeLimit | quote }}
