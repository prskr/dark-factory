apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dark-factory.controlPlane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dark-factory.gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dark-factory.fullname" . }}-control-plane-sandbox
  namespace: {{ .Values.sandboxNamespace.name }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  {{- if eq .Values.enforcement.mode "cilium" }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  {{- end }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dark-factory.fullname" . }}-control-plane-sandbox
  namespace: {{ .Values.sandboxNamespace.name }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    ignore-check.kube-linter.io/access-to-create-pods: "the control plane creates one Pod per run in the sandbox namespace (PSA restricted)"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dark-factory.fullname" . }}-control-plane-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "dark-factory.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dark-factory.fullname" . }}-control-plane-instance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dark-factory.fullname" . }}-control-plane-instance
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dark-factory.fullname" . }}-control-plane-instance
subjects:
  - kind: ServiceAccount
    name: {{ include "dark-factory.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.clusterTargets.anyNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dark-factory.clusterScoped.base" . }}-cluster-targets-reader
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dark-factory.clusterScoped.base" . }}-cluster-targets-reader
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dark-factory.clusterScoped.base" . }}-cluster-targets-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "dark-factory.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $ns := .Values.clusterTargets.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dark-factory.clusterScoped.base" $ }}-cluster-target-reader
  namespace: {{ $ns }}
  labels:
    {{- include "dark-factory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dark-factory.clusterScoped.base" $ }}-cluster-target-reader
  namespace: {{ $ns }}
  labels:
    {{- include "dark-factory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dark-factory.clusterScoped.base" $ }}-cluster-target-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "dark-factory.controlPlane.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dark-factory.clusterScoped.base" . }}-sandbox-ns-reader
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ .Values.sandboxNamespace.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dark-factory.clusterScoped.base" . }}-sandbox-ns-reader
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dark-factory.clusterScoped.base" . }}-sandbox-ns-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "dark-factory.controlPlane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
