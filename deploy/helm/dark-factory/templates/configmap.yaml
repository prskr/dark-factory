apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dark-factory.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
data:
  config.yaml: |
    instanceName: {{ .Values.instanceName | quote }}
    database:
      host: {{ .Values.database.host | quote }}
      port: {{ .Values.database.port }}
      database: {{ .Values.database.database | quote }}
      user: {{ .Values.database.app.user | quote }}
      passwordFile: /run/secrets/db-app/password
      schema: {{ .Values.database.schema | quote }}
      maxConnections: {{ .Values.database.maxConnections }}
    server:
      httpPort: {{ .Values.controlPlane.ports.http }}
      agentPort: {{ .Values.controlPlane.ports.agent }}
      internalGrpcPort: {{ .Values.controlPlane.ports.internalGrpc }}
    gateway:
      proxyPort: {{ .Values.gateway.ports.proxy }}
      internalGrpcPort: {{ .Values.gateway.ports.internalGrpc }}
      healthPort: {{ .Values.gateway.ports.health }}
      controlPlaneHost: {{ printf "%s-control-plane" (include "dark-factory.fullname" .) | quote }}
      identity: {{ printf "%s-gateway" (include "dark-factory.fullname" .) | quote }}
      headlessService: {{ printf "%s-gateway-headless.%s.svc" (include "dark-factory.fullname" .) .Release.Namespace | quote }}
      bufferSize: {{ .Values.gateway.bufferSize }}
      bufferMaxAgeSeconds: {{ .Values.gateway.bufferMaxAgeSeconds }}
      blockedCidrs: {{ .Values.gateway.blockedCidrs | toJson }}
    {{- include "dark-factory.sandboxConfig" . | nindent 4 }}
    runs:
      keepAliveSeconds: {{ .Values.runs.keepAliveSeconds }}
    forge:
      allowPlainHttp: {{ .Values.forge.allowPlainHttp }}
    web:
      showHiddenBlocks: {{ .Values.web.showHiddenBlocks }}
    harness:
      claudeCode:
        image: {{ include "dark-factory.harness.claudeCode.image" . | quote }}
    {{- if .Values.oidc.publicUrl }}
    auth:
      issuerUrl: {{ .Values.oidc.issuerUrl | quote }}
      clientId: {{ .Values.oidc.clientId | quote }}
      clientSecretFile: /run/secrets/oidc/client-secret
      publicUrl: {{ .Values.oidc.publicUrl | quote }}
      rolesClaim: {{ .Values.oidc.rolesClaim | quote }}
      {{- if .Values.oidc.extraScopes }}
      extraScopes: {{ .Values.oidc.extraScopes | toJson }}
      {{- end }}
    {{- end }}
    clusterTargets:
      anyNamespace: {{ .Values.clusterTargets.anyNamespace }}
      namespaces: {{ .Values.clusterTargets.namespaces | toJson }}
    {{- include "dark-factory.pluginsConfig" . | nindent 4 }}
    agent:
      tls:
        certFile: /etc/dark-factory/tls/tls.crt
        keyFile: /etc/dark-factory/tls/tls.key
        clientCaFile: /etc/dark-factory/tls/ca.crt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dark-factory.fullname" . }}-migrate-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  migrate-config.yaml: |
    instanceName: {{ .Values.instanceName | quote }}
    database:
      host: {{ .Values.database.host | quote }}
      port: {{ .Values.database.port }}
      database: {{ .Values.database.database | quote }}
      user: {{ .Values.database.owner.user | quote }}
      passwordFile: /run/secrets/db-owner/password
      schema: {{ .Values.database.schema | quote }}
      maxConnections: 2
      migrate:
        appRole: {{ .Values.database.app.user | quote }}
        manageAppRole: {{ .Values.database.migrate.manageAppRole }}
        {{- if .Values.database.migrate.manageAppRole }}
        appPasswordFile: /run/secrets/db-app/password
        {{- end }}
    server:
      httpPort: {{ .Values.controlPlane.ports.http }}
      agentPort: {{ .Values.controlPlane.ports.agent }}
      internalGrpcPort: {{ .Values.controlPlane.ports.internalGrpc }}
    gateway:
      proxyPort: {{ .Values.gateway.ports.proxy }}
      internalGrpcPort: {{ .Values.gateway.ports.internalGrpc }}
      healthPort: {{ .Values.gateway.ports.health }}
    {{- include "dark-factory.sandboxConfig" . | nindent 4 }}
