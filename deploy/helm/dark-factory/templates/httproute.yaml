{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dark-factory.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "dark-factory.fullname" . }}-control-plane
          port: {{ .Values.controlPlane.ports.http }}
{{- end }}
