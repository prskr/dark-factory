# Single-node kind cluster of `just e2e-local` (docs/demo.md). kindnet enforces NetworkPolicy.
# e2e-local.sh appends `extraMounts` to the last node when a proxy CA exists: keep the node last.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # The host reaches the cluster through NodePort Services (no `kubectl port-forward` that dies
    # with its pod): container port 30xxx of the node is host port 1xxxx, on the loopback address
    # only. The nodePort values are in postgres.yaml, playwright.yaml, receiver.yaml and
    # forgejo-values.yaml; the host ports in e2e-local.sh and docs/demo.md.
    extraPortMappings:
      # PostgreSQL
      - {containerPort: 30432, hostPort: 15432, listenAddress: 127.0.0.1, protocol: TCP}
      # Forgejo
      - {containerPort: 30300, hostPort: 13000, listenAddress: 127.0.0.1, protocol: TCP}
      # Playwright server
      - {containerPort: 30301, hostPort: 13001, listenAddress: 127.0.0.1, protocol: TCP}
      # Lifecycle event receiver
      - {containerPort: 30302, hostPort: 13002, listenAddress: 127.0.0.1, protocol: TCP}
