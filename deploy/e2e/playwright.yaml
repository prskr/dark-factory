# Browser of the e2e suite: a Playwright server the tests reach over a port-forwarded WebSocket.
# The version must match the driver of the `playwright-rs` crate (crates/df-e2e/Cargo.toml).
apiVersion: v1
kind: Namespace
metadata:
  name: playwright
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright
  namespace: playwright
spec:
  replicas: 1
  selector:
    matchLabels: {app: playwright}
  template:
    metadata:
      labels: {app: playwright}
    spec:
      containers:
        - name: playwright
          # `//deploy:load_e2e_playwright`: the Playwright base image plus playwright-core, loaded by
          # e2e-local.sh; the command (run-server on port 3000) is the image's entrypoint.
          image: ghcr.io/prskr/dark-factory/playwright-server:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            # One Chromium per connection, up to three at once (two tests, one with a second
            # viewer), plus the memory-backed /dev/shm: 1.5 Gi was OOM-killed in CI.
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: playwright
  namespace: playwright
spec:
  # NodePort: the test host connects on 127.0.0.1:13001 (kind.yaml maps it).
  type: NodePort
  selector: {app: playwright}
  ports:
    - port: 3000
      nodePort: 30301
