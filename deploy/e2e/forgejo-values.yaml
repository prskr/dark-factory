# Values of the Forgejo Helm chart (oci://code.forgejo.org/forgejo-helm/forgejo) for the e2e
# cluster: SQLite, no persistence. The release is named `forgejo`, so the Service is `forgejo-http`.
image:
  rootless: true
persistence:
  enabled: false
test:
  enabled: false
# NodePort: the test host reaches Forgejo on 127.0.0.1:13000 (kind.yaml maps it). The chart's
# default is a headless Service; a NodePort needs a ClusterIP, which the empty value gives.
service:
  http:
    type: NodePort
    clusterIP: ""
    nodePort: 30300
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
gitea:
  # `username` and `password` of the admin come from `e2e-local.sh` (`--set`), which also hands
  # them to `setup forgejo`.
  admin:
    email: e2e-admin@example.com
  config:
    server:
      DOMAIN: forgejo-http.forgejo.svc
      ROOT_URL: http://forgejo-http.forgejo.svc:3000/
    database:
      DB_TYPE: sqlite3
    service:
      DISABLE_REGISTRATION: true
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    # `webhook.ALLOWED_HOST_LIST` (the control plane Service, a private address Forgejo refuses by
    # default, docs/content/integrations/forges/webhooks.md) is set by `e2e-local.sh` from the
    # release and namespace names.
