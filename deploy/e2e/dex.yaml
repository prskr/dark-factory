# Dex of the e2e cluster: static users like dev/dex.yaml, issuer and redirect URI through cluster
# DNS so the browser pod and the control plane see the same issuer URL.
apiVersion: v1
kind: Namespace
metadata:
  name: dex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dex
data:
  config.yaml: |
    issuer: http://dex.dex.svc:5556/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: dark-factory
        name: Dark Factory (e2e)
        secret: e2e-oidc-secret
        redirectURIs:
          - http://dark-factory-control-plane.dark-factory.svc:8080/auth/callback
        postLogoutRedirectURIs:
          - http://dark-factory-control-plane.dark-factory.svc:8080/
    enablePasswordDB: true
    staticPasswords:
      # bcrypt hash of "password" (Dex examples/config-dev.yaml)
      - email: admin@example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: admin
        name: E2E Admin
        userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
        groups:
          - board-member
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
spec:
  replicas: 1
  selector:
    matchLabels: {app: dex}
  template:
    metadata:
      labels: {app: dex}
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.1
          command: [dex, serve, /etc/dex/config.yaml]
          ports:
            - containerPort: 5556
          readinessProbe:
            httpGet: {path: /dex/healthz, port: 5556}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/dex}
      volumes:
        - name: config
          configMap:
            name: dex
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
spec:
  selector: {app: dex}
  ports:
    - port: 5556
