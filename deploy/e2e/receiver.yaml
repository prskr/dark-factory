# Lifecycle event receiver of the e2e suite (crates/df-e2e/tests/lifecycle_events.rs): stores every
# POST with its headers and body in memory and returns them as a JSON list on GET. Plain http in
# the cluster: the e2e control plane runs with `--unrestricted-project-subscriptions`.
apiVersion: v1
kind: Namespace
metadata:
  name: receiver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: receiver
  namespace: receiver
data:
  receiver.py: |
    import json
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    received = []
    lock = threading.Lock()

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("content-length", "0")))
            entry = {
                "path": self.path,
                "headers": {k.lower(): v for k, v in self.headers.items()},
                "body": body.decode("utf-8"),
            }
            with lock:
                received.append(entry)
            self.send_response(204)
            self.end_headers()

        def do_GET(self):
            with lock:
                data = json.dumps(received).encode("utf-8")
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: receiver
spec:
  replicas: 1
  selector:
    matchLabels: {app: receiver}
  template:
    metadata:
      labels: {app: receiver}
    spec:
      containers:
        - name: receiver
          image: docker.io/library/python:3.13-alpine
          command: [python, -u, /app/receiver.py]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap: {name: receiver}
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
  namespace: receiver
spec:
  selector: {app: receiver}
  ports:
    - port: 8080
