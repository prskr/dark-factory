# The image ships the musl builds for both architectures, whatever host updates the lockfile.
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [musl]
# rules_js selects optional dependencies by os and cpu only, so the glibc builds of the Claude Code CLI
# (~270 MB each) would end up in the image next to the musl ones.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-*"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-win32-*"
# No dependency runs install scripts.
allowBuilds: {}
