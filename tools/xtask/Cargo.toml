[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Standalone workspace: keeps HTTP deps out of the product's Cargo.lock / crate_universe graph.
[workspace]

# Mirrors `[workspace.lints]` of the root Cargo.toml (a standalone workspace cannot inherit it).
# `cargo xtask check-crates` fails when the two tables differ.
[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
let_underscore_future = "warn"
map_err_ignore = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
assert_is_empty = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
excessive_nesting = "warn"

[dependencies]
anyhow = "1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "1.1.8"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
