schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Load skill `domain-modeling` before you plan a change, and use the terms of `product/GLOSSARY.md` in every artifact.
  While planning, write each new or changed term into `product/GLOSSARY.md` once it is resolved, and record each decision that is hard to reverse, surprising without context and the result of a real trade-off as an ADR in `docs/adr/` (indexed in `docs/adr/README.md`).
  Every configuration key, file path and external behavior (a forge's API, namespace or verification flow) an artifact names is verified before it is written: keys and paths in the code, external behavior in its source or against the e2e environment. What cannot be verified while planning is marked "(unverified)" in the artifact and gets a task that verifies it first.

rules:
  proposal:
    - The Impact section names the glossary terms and ADRs the change adds or changes, or says that the domain model is unchanged.
    - Every out-of-scope item that is a real follow-up names its target in product/iterations/roadmap.md (an iteration or the backlog); an item that is not wanted says "rejected".
    - New protobuf fields and enum values in existing messages and enums get placeholder numbers (`<n1>`, `<n2>`, …) or none, never a concrete field number or a `reserved` entry; the final numbers are assigned when the change is implemented, because parallel changes would otherwise claim the same numbers.
  specs:
    - A requirement's text stays under 500 characters, a MODIFIED requirement counted as it reads after the edit (strict validation rejects longer ones once the change is archived and synced); move examples and edge cases into scenarios, or split the requirement.
    - New protobuf fields and enum values in existing messages and enums get placeholder numbers (`<n1>`, `<n2>`, …) or none, never a concrete field number or a `reserved` entry; the final numbers are assigned when the change is implemented, because parallel changes would otherwise claim the same numbers.
  design:
    - Every non-goal that is a real follow-up names its target in product/iterations/roadmap.md (an iteration or the backlog); a non-goal that is not wanted says "rejected".
    - New protobuf fields and enum values in existing messages and enums get placeholder numbers (`= <n1>`, `= <n2>`, …), never a concrete field number or a `reserved` entry (fields of a message the change creates may be numbered), with a comment that the final numbers are assigned when the change is implemented. Parallel changes would otherwise claim the same numbers.
  tasks:
    - Every spec scenario has a task that writes a behavioral test for it, one that fails when the code under test is removed or broken (a unit, router or e2e test that runs the code). A check of source text or rendered markup only proves that something is present or absent (for example "no inline script"), never that a scenario's behavior holds.
    - A new behavior gets its own test, named after it; tasks never extend an existing e2e test with a further behavior (skill `e2e`, "A test checks one behavior").
    - A layout or browser check that a Playwright assertion can make (bounding boxes, focus, computed style) is an e2e test, not a manual check. Only checks no test can make (a real screen reader) are manual, and the task says so.
    - A change that adds protobuf fields or enum values has a task that assigns the final numbers (the next free ones in the message at implementation time, checked against `reserved` entries) and replaces the placeholders in the change's artifacts.
    - Every change that alters what a user or operator sees or configures (UI behavior, configuration keys, Helm values, environment variables, metrics, logs, install or upgrade steps, architecture, security properties) has a task that updates the published docs (docs/content/, and the crate references mounted from crates/*/docs/), names the pages to change or create, and is verified with `just docs-build`. A change without such effects says so in one line instead.

operations:
  apply:
    guidance:
      - Update the published docs (docs/content/ and the mounted crate references) in the same change as the behavior they describe, and run `just docs-build`, which also checks links. Describe only what is built; never document planned behavior as existing.
  archive:
    guidance:
      - Before archiving, check that the published docs (docs/content/ and the mounted crate references) describe what the change built. If a page is missing or outdated, list the gaps to the user and fix them (or have them fixed) before archiving; never archive with known documentation gaps.
      - Before archiving, check the change's out-of-scope items and non-goals against product/iterations/roadmap.md. Add a backlog row (item, status, reference to the archived change) for every real follow-up that is neither in an iteration nor in the backlog, and show the rows to the user before writing them.
