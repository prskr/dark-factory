[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://code.icb4dc0.de/prskr/dark-factory"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
agent-client-protocol = { version = "3.4.0", features = ["stdio"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
df-core = { path = "crates/df-core" }
df-db = { path = "crates/df-db" }
df-proto = { path = "crates/df-proto" }
df-web = { path = "crates/df-web" }
futures = "0.3"
hex = "0.4"
pbjson = "0.7"
pbjson-build = "0.7"
pbjson-types = "0.7"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
regex = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.17"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
static_assertions = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "prost", "codegen", "tls"] }
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
wit-bindgen = "0.51"

