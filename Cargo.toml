[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://code.icb4dc0.de/prskr/dark-factory"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
let_underscore_future = "warn"
map_err_ignore = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
# Noise on internal crates (design D3).
must_use_candidate = "allow"
# Internal crates without API consumers (design D3).
missing_errors_doc = "allow"
# `assert!(x.is_empty())` reads better than the suggested `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# Internal crates without API consumers, like `missing_errors_doc`; most hits are test utilities.
missing_panics_doc = "allow"
# maud components take `Markup` by value, the natural form for `html!` composition.
needless_pass_by_value = "allow"
# Pairs such as `stdin`/`stdout` or `tx1`/`tx2` are the clearest names.
similar_names = "allow"
# Wire structs and state records with independent flags; a state machine would add code, not clarity.
struct_excessive_bools = "allow"
excessive_nesting = "warn"

[workspace.metadata.file-length]
max-lines = 1500

[workspace.metadata.file-length.allow]
"crates/df-k8s/src/crd.rs" = "generated by kopium from the agent-sandbox CRD"

[workspace.dependencies]
agent-client-protocol = { version = "3.4.0", features = ["stdio"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "matched-path", "query", "tokio"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
comrak = { version = "0.57", default-features = false }
df-agent-channel = { path = "crates/df-agent-channel" }
df-core = { path = "crates/df-core" }
df-db = { path = "crates/df-db" }
df-gateway = { path = "crates/df-gateway" }
df-k8s = { path = "crates/df-k8s" }
df-plugins = { path = "crates/df-plugins" }
df-proto = { path = "crates/df-proto" }
df-telemetry = { path = "crates/df-telemetry" }
df-test-postgres = { path = "crates/df-test-postgres" }
df-web = { path = "crates/df-web" }
futures = "0.3"
hex = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
insta = { version = "1.49", features = ["yaml"] }
jsonschema = { version = "0.60", default-features = false }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
maud = { version = "0.27", features = ["axum"] }
openidconnect = "4"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "tls-ring", "tls-roots", "metrics", "trace"] }
opentelemetry-prometheus = { version = "0.33", default-features = false, features = ["internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "trace", "internal-logs"] }
pbjson = "0.9"
pbjson-build = "0.9"
pbjson-types = "0.9"
prometheus = { version = "0.14", default-features = false }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
rpi-agent = "=0.11.0"
rpi-ai = { version = "=0.11.0", features = ["providers"] }
rpi-tools = "=0.11.0"
rsa = { version = "0.9", features = ["pem"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.0.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
static_assertions = "1"
tempfile = "3"
testcontainers = { version = "0.28", default-features = false, features = ["reusable-containers"] }
thiserror = "2"
tls-parser = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["compression-br", "compression-gzip"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tower-test = "0.4"
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
wasmtime = { version = "50", default-features = false, features = ["component-model", "async", "cranelift", "runtime", "std", "parallel-compilation", "wat"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wasmtime-wasi-config = "50"
wasmtime-wasi-http = { version = "50", default-features = false, features = ["p2", "default-send-request"] }
wiremock = "0.6"
wit-bindgen = "0.63"
x509-parser = "0.18"


[workspace.metadata.outdated.ignore]
reqwest = "native-harness-spike: rpi-ai 0.11 builds its provider client on reqwest 0.12; df-harness must hand it a client of the same version"
