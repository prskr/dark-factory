[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://code.icb4dc0.de/prskr/dark-factory"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
agent-client-protocol = { version = "3.4.0", features = ["stdio"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
df-agent-channel = { path = "crates/df-agent-channel" }
df-core = { path = "crates/df-core" }
df-db = { path = "crates/df-db" }
df-k8s = { path = "crates/df-k8s" }
df-plugins = { path = "crates/df-plugins" }
df-proto = { path = "crates/df-proto" }
df-test-postgres = { path = "crates/df-test-postgres" }
df-web = { path = "crates/df-web" }
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
insta = { version = "1.49", features = ["yaml"] }
jsonschema = { version = "0.59", default-features = false }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
pbjson = "0.9"
pbjson-build = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
regex = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-async-rw"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.0.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
static_assertions = "1"
tempfile = "3"
testcontainers = { version = "0.28", default-features = false, features = ["reusable-containers"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower-test = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
wasmtime = { version = "50", default-features = false, features = ["component-model", "async", "cranelift", "runtime", "std", "parallel-compilation", "wat"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wasmtime-wasi-config = "50"
wasmtime-wasi-http = { version = "50", default-features = false, features = ["p2", "default-send-request"] }
wiremock = "0.6"
wit-bindgen = "0.63"
x509-parser = "0.18"

