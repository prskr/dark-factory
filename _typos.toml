[files]
extend-exclude = [
    # Vendored WASI WIT definitions.
    "contract/wit/integrations/deps/**",
    # Vendored minified htmx and Alpine.
    "crates/df-web/assets/vendor/**",
    # Generated extract of GitHub's REST API description (upstream words such as `repo.nwo`).
    "plugins/github/tests/fixtures/github-openapi.json",
    # GitHub's example webhook payloads from `octokit/webhooks`, verbatim (typos and node ids).
    "plugins/github/tests/fixtures/webhooks/**",
    # Vendored Hextra theme (Hugo module).
    "docs/_vendor/**",
]

[default]
extend-ignore-re = [
    # Verbatim linker error message.
    "mis-aligned",
]
