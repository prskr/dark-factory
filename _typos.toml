[files]
extend-exclude = [
    # Vendored WASI WIT definitions.
    "contract/wit/integrations/deps/**",
    # Vendored minified htmx and Alpine.
    "crates/df-web/assets/vendor/**",
    # Generated Tailwind output.
    "crates/df-web/assets/app.css",
]

[default]
extend-ignore-re = [
    # Verbatim linker error message.
    "mis-aligned",
]
