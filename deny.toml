[advisories]
version = 2
ignore = [
    # Marvin attack on RSA private-key operations; no fixed `rsa` release exists. Production only
    # verifies OIDC ID-token signatures with the provider's public keys (`openidconnect`); private
    # keys are used only by df-web's test OIDC provider. Revisit when `openidconnect` moves to a
    # fixed `rsa` (0.10).
    { id = "RUSTSEC-2023-0071", reason = "rsa: only public-key verification in production" },
    # `astral-tokio-tar` is unmaintained since 2026-11-03 (no fixed release). Reached only through
    # testcontainers, a dev dependency of df-test-postgres; it packs the files testcontainers copies
    # into test containers and never runs in production. Revisit when testcontainers (0.28.0)
    # moves to another tar crate.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar unmaintained: dev-only (testcontainers)" },
    # bincode 1.3.3 is declared complete by its authors. syntect (df-web code highlighting) uses it
    # only to load its bundled syntax and theme dumps, which this repository does not control.
    # Revisit when syntect moves to another serialization crate.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 unmaintained: syntect loads its bundled dumps with it" },
    # `chrono` is unmaintained (no fixed release); not a vulnerability. Our crates use `jiff`; only
    # openidconnect, oauth2, rmcp, schemars and pbjson-types still pull `chrono` in (`bans` below
    # keeps it from coming back as a direct dependency). Drop this entry once those dependencies
    # move to `jiff` or `time` (backlog row in product/iterations/roadmap.md).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained: required by openidconnect, oauth2, rmcp, schemars and pbjson-types" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "aws-lc-rs", reason = "Use the ring crypto provider instead for musl cross-compilation compatibility" },
    { name = "aws-lc-sys", reason = "Use the ring crypto provider instead for musl cross-compilation compatibility" },
    { name = "chrono", wrappers = ["oauth2", "openidconnect", "pbjson-types", "rmcp", "schemars"], reason = "Unmaintained (RUSTSEC-2026-0543): use jiff; only these third-party crates still require it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
