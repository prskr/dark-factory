[advisories]
version = 2
ignore = [
    # Only reachable through tonic 0.12 (TLS client/server config). No fixed release exists; the
    # advisory goes away with the tonic upgrade (0.14 no longer depends on rustls-pemfile).
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, transitive via tonic 0.12; remove when tonic is upgraded" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "aws-lc-rs", reason = "Use the ring crypto provider instead for musl cross-compilation compatibility" },
    { name = "aws-lc-sys", reason = "Use the ring crypto provider instead for musl cross-compilation compatibility" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
