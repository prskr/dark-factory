[advisories]
version = 2
ignore = [
    # Marvin attack on RSA private-key operations; no fixed `rsa` release exists. Production only
    # verifies OIDC ID-token signatures with the provider's public keys (`openidconnect`); private
    # keys are used only by df-web's test OIDC provider. Revisit when `openidconnect` moves to a
    # fixed `rsa` (0.10).
    { id = "RUSTSEC-2023-0071", reason = "rsa: only public-key verification in production" },
    # Non-constant-time operations in crypto-bigint 0.5 (fixed in 0.7.6). Reached only through
    # openidconnect -> p256/p384 -> elliptic-curve 0.13, which verifies ES256/ES384 ID-token
    # signatures with the provider's public keys: no secret integers. Revisit when `openidconnect`
    # moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint: only public-key ECDSA verification" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "aws-lc-rs", reason = "Use the ring crypto provider instead for musl cross-compilation compatibility" },
    { name = "aws-lc-sys", reason = "Use the ring crypto provider instead for musl cross-compilation compatibility" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
