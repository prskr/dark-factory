# Instance configuration for `just serve-local` (dark-factory serve --no-cluster). Paths are relative
# to the repository root; `just serve-local` writes the files under target/local-dev.
instanceName: local-dev
database:
  host: 127.0.0.1
  port: 5432
  database: dark_factory
  user: postgres
  passwordFile: target/local-dev/owner-password
  schema: dark_factory
  maxConnections: 10
  migrate:
    appRole: dark_factory_app
    manageAppRole: true
    appPasswordFile: target/local-dev/app-password
sandbox:
  namespace: dark-factory-sandboxes
  instanceNamespace: dark-factory
agent:
  # Throwaway self-signed certificate; no sandbox connects locally.
  tls:
    certFile: target/local-dev/agent.crt
    keyFile: target/local-dev/agent.key
    clientCaFile: target/local-dev/agent.crt
# Throwaway Ed25519 key; signs lifecycle events and is served at /lifecycle-events/public-key.
lifecycleEvents:
  signingKeyFile: target/local-dev/lifecycle-events.key
plugins:
  forgejo:
    path: target/wasm32-wasip2/debug/forgejo_plugin.wasm
  github:
    path: target/wasm32-wasip2/debug/github_plugin.wasm
    authScheme: bearer
    hosts:
      - host: github.com
        apiUrl: https://api.github.com
publicUrl: http://127.0.0.1:8080
auth:
  issuerUrl: http://127.0.0.1:5556/dex
  clientId: dark-factory
  clientSecretFile: target/local-dev/oidc-client-secret
  rolesClaim: groups
  extraScopes: [groups, offline_access]
