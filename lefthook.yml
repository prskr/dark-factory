# Lefthook Git Hooks Configuration
# Reference: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.rs'
      # Bazel's rustfmt aspect: the standalone rustfmt binary is not runnable (missing librustc_driver)
      run: bazel build --config=fmt //crates/... //plugins/...

    kingfisher:
      run: build/with_tools.sh kingfisher scan . --staged --no-update-check --no-validate

    buildifier:
      glob: ['*.bazel', '*.bzl']
      run: build/with_tools.sh buildifier -mode=check {staged_files}

    shellcheck:
      glob: '*.sh'
      run: build/with_tools.sh shellcheck --severity=warning {staged_files}

    buf-format:
      glob: '*.proto'
      run: build/with_tools.sh buf format -d --exit-code contract/proto

    hadolint:
      glob: '*Dockerfile*'
      run: build/with_tools.sh hadolint {staged_files}

    typos:
      run: build/with_tools.sh typos --force-exclude {staged_files}

    cargo-machete:
      glob: ['Cargo.toml', '*.rs']
      run: build/with_tools.sh cargo-machete

    # Requirements of new or changed dependencies must not exclude the latest crates.io release.
    # Checks only what differs from HEAD; passes with a warning when crates.io is unreachable.
    outdated-deps:
      glob: ['Cargo.toml', '*/Cargo.toml', '*/*/Cargo.toml']
      run: build/with_tools.sh cargo xtask outdated --since HEAD

    # Every workspace member is built, tested and linted by both build systems.
    check-crates:
      glob: ['Cargo.toml', '**/Cargo.toml', '**/BUILD.bazel', 'MODULE.bazel', '**/tests/*.rs']
      run: build/with_tools.sh cargo xtask check-crates

    check-file-length:
      run: build/with_tools.sh cargo xtask check-file-length {staged_files}

    check-test-names:
      glob: '*.rs'
      run: build/with_tools.sh cargo xtask check-test-names {staged_files}

    image-versions:
      glob: ['deploy/images/**', 'crates/df-core/src/config.rs', 'deploy/helm/**', 'crates/df-k8s/README.md', 'crates/df-agent-channel/docs/configuration.md']
      run: deploy/images/check_versions.sh

    helm-lint:
      glob: 'deploy/helm/**'
      run: build/with_tools.sh helm lint deploy/helm/dark-factory

    helm-kube-version:
      glob: 'deploy/helm/**'
      run: build/with_tools.sh deploy/helm/check_kube_version.sh

    helm-unittest:
      glob: 'deploy/helm/**'
      run: build/with_tools.sh helm-unittest deploy/helm/dark-factory

pre-push:
  # Sequential execution prevents Cargo target/ lock contention
  parallel: false
  commands:
    clippy:
      run: build/with_tools.sh cargo clippy --all-targets --all-features -- -D warnings

    # xtask is its own Cargo workspace, so the clippy run above does not cover it.
    clippy-xtask:
      run: build/with_tools.sh cargo clippy --manifest-path tools/xtask/Cargo.toml --all-targets -- -D warnings

    cargo-deny:
      run: build/with_tools.sh cargo deny check
