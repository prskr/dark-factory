# Lefthook Git Hooks Configuration
# Reference: https://github.com/evilmartians/lefthook
#
# Future linters to consider adding if installed:
#   - taplo (TOML formatting & linting):
#       glob: '*.toml'
#       run: taplo fmt --check {staged_files}
#   - typos (Spell checking across code and docs):
#       run: typos {staged_files}
#   - hadolint (Dockerfile linting):
#       glob: '*Dockerfile*'
#       run: hadolint {staged_files}
#   - cargo-machete (Unused dependencies detector):
#       run: cargo machete

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.rs'
      # Bazel's rustfmt aspect: the standalone rustfmt binary is not runnable (missing librustc_driver)
      run: bazel build --config=fmt //crates/... //plugins/...

    kingfisher:
      run: build/with_tools.sh kingfisher scan . --staged --no-update-check --no-validate

    buildifier:
      glob: ['*.bazel', '*.bzl']
      run: build/with_tools.sh buildifier -mode=check {staged_files}

    shellcheck:
      glob: '*.sh'
      run: build/with_tools.sh shellcheck --severity=warning {staged_files}

    buf-format:
      glob: '*.proto'
      run: build/with_tools.sh buf format -d --exit-code contract/proto

    helm-lint:
      glob: 'deploy/helm/**'
      run: build/with_tools.sh helm lint deploy/helm/dark-factory

    helm-unittest:
      glob: 'deploy/helm/**'
      run: build/with_tools.sh helm-unittest deploy/helm/dark-factory

pre-push:
  # Sequential execution prevents Cargo target/ lock contention
  parallel: false
  commands:
    clippy:
      run: build/with_tools.sh cargo clippy --all-targets --all-features -- -D warnings

    cargo-deny:
      run: build/with_tools.sh cargo deny check
