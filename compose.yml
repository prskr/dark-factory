# Local services for running dark-factory by hand (`just db`, `just serve-local`), see
# docs/development.md. Tests do not use them: they start their own PostgreSQL through testcontainers.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dark_factory
    ports:
      - "127.0.0.1:5432:5432"

  # OIDC provider for the web UI with static users (dev/dex.yaml).
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex.yaml:/etc/dex/config.yaml:ro,z
    ports:
      - "127.0.0.1:5556:5556"

  # Headless Chromium behind the Playwright MCP for design comparisons (docs/design-workflow.md).
  # Not started by `just db`: `podman compose --profile design up -d playwright`. Host networking so
  # the browser reaches the web UI and Dex on 127.0.0.1 like a local browser; keep the version in
  # sync with the `playwright` entry of .mcp.json.
  playwright:
    image: mcr.microsoft.com/playwright/mcp:v0.0.83
    profiles: ["design"]
    network_mode: host
    command: ["--isolated", "--host", "127.0.0.1", "--port", "8931"]
