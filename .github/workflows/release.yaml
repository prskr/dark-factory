name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/prskr/dark-factory/*
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Static musl binaries for amd64 and arm64 (see docs/development.md)
      - name: Verify images
        run: bazel test //deploy:images_structure_test

      # Version tag for release tags (v1.2.3), `dev` for manual runs from a branch
      - name: Push images
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: bazel run --//deploy:image_tag="$IMAGE_TAG" //deploy:push_images

  # Reference images built from Dockerfiles (openspec change harness-images, design D10)
  harness-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/prskr/dark-factory/*
    strategy:
      fail-fast: false
      matrix:
        image: [claude-harness, claude-project]
    env:
      REGISTRY_IMAGE: ghcr.io/prskr/dark-factory/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The harness image is tagged with the adapter version (ARG of its Dockerfile; `<version>-dev` for
      # manual runs from a branch, so a release tag is never overwritten), the project image with the
      # release tag (`dev` for manual runs). `latest` only for release tags.
      - name: Tags
        id: tags
        run: |
          if [[ "$MATRIX_IMAGE" == claude-harness ]]; then
            version="$(sed -n 's/^ARG CLAUDE_AGENT_ACP_VERSION=//p' deploy/images/claude-harness/Dockerfile)"
            if [[ "$REF_TYPE" != tag ]]; then version+="-dev"; fi
          else
            version="${REF_TYPE_TAG:-dev}"
          fi
          tags="$REGISTRY_IMAGE:$version"
          if [[ "$REF_TYPE" == tag ]]; then tags+=$'\n'"$REGISTRY_IMAGE:latest"; fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          REF_TYPE: ${{ github.ref_type }}
          REF_TYPE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: ./.github/actions/check-image
        with:
          image: ${{ matrix.image }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.image }} (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
