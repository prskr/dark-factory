name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/prskr/dark-factory/*
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Static musl binaries for amd64 and arm64 (see docs/development.md)
      - name: Verify images
        run: bazel test //deploy:images_structure_test

      # Version tag for release tags (v1.2.3), `dev` for manual runs from a branch
      - name: Push images
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: bazel run --//deploy:image_tag="$IMAGE_TAG" //deploy:push_images
