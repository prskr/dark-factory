name: Release

# Started manually from `main`, without inputs (openspec change release-versioning, design D4,
# docs/releasing.md). Computes the next version `YYYY.M.N`, pushes every image and the Helm chart
# and only then creates the tag and the GitHub Release, so a failed run leaves neither.
on:
  workflow_dispatch:

# Two releases must not compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/prskr/dark-factory

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      # Before anything is built or pushed
      - name: Only main can be released
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Releases are cut from main, not from $REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # all tags
          persist-credentials: false

      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }} # `gh release list`
        run: |
          rustup show active-toolchain || rustup toolchain install
          version="$(cargo xtask next-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  # Control plane, runtime, plugins and test project (Bazel, static musl binaries for amd64 and arm64)
  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/prskr/dark-factory/*
    env:
      # BuildBuddy remote cache, as in ci.yaml (docs/development.md). No platform flag: the image
      # targets set their own platforms (amd64 and arm64).
      BAZEL_ARGS: >-
        --config=cache --config=ci
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify images
        run: bazel test $BAZEL_ARGS //deploy:images_structure_test //deploy/images/claude-harness:structure_test //deploy/images/opencode-harness:structure_test

      - name: Push images
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bazel run $BAZEL_ARGS --//build:version="$VERSION" //deploy:push_images

  # claude-project (Dockerfile), claude-harness and opencode-harness (Bazel); the harness digests go into the chart
  reference-images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/prskr/dark-factory/*
    outputs:
      harness-digest: ${{ steps.harness.outputs.digest }}
      opencode-digest: ${{ steps.opencode.outputs.digest }}
    env:
      BAZEL_ARGS: >-
        --config=cache --config=ci
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: ./.github/actions/check-image
        with:
          image: claude-project

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push claude-project (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/images/claude-project
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/claude-project:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=claude-project

      # Tagged with the adapter version from its package.json. GHCR tags are mutable and later
      # releases push the same tag again, so the chart pins the digest this run pushed.
      - name: Push claude-harness
        id: harness
        run: |
          version="$(jq -r '.dependencies["@agentclientprotocol/claude-agent-acp"]' deploy/images/claude-harness/package.json)"
          bazel run $BAZEL_ARGS --//deploy/images/claude-harness:image_tag="$version" //deploy/images/claude-harness:push
          # the digest of the image index that `push` uploads, computed by the build, not read back by tag;
          # build and cquery need the same flags, or cquery names the file of another configuration
          bazel build $BAZEL_ARGS //deploy/images/claude-harness:digest
          digest="$(cat "$(bazel cquery $BAZEL_ARGS --output=files //deploy/images/claude-harness:digest)")"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for claude-harness:$version"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Tagged with the OpenCode version of OPENCODE_VERSION in MODULE.bazel; the chart pins the digest.
      - name: Push opencode-harness
        id: opencode
        run: |
          version="$(sed -n 's/^OPENCODE_VERSION = "\(.*\)"/\1/p' MODULE.bazel)"
          [[ -n "$version" ]] || { echo "::error::no OPENCODE_VERSION in MODULE.bazel"; exit 1; }
          bazel run $BAZEL_ARGS --//deploy/images/opencode-harness:image_tag="$version" //deploy/images/opencode-harness:push
          bazel build $BAZEL_ARGS //deploy/images/opencode-harness:digest
          digest="$(cat "$(bazel cquery $BAZEL_ARGS --output=files //deploy/images/opencode-harness:digest)")"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for opencode-harness:$version"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # After all images: the chart references them by the release version, and it is installable
  # from the registry even without a GitHub Release.
  chart:
    needs: [version, images, reference-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/prskr/dark-factory/charts/*
    env:
      BAZEL_ARGS: >-
        --config=cache --config=ci
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      # the pinned helm and yq of the repo (docs/development.md, "Pinned linters")
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HARNESS_DIGEST: ${{ needs.reference-images.outputs.harness-digest }}
          OPENCODE_DIGEST: ${{ needs.reference-images.outputs.opencode-digest }}
        run: |
          # bazel_env exits 1 when direnv is missing (runners), after it has written .bazel_env/bin
          bazel run $BAZEL_ARGS //:bazel_env || test -x .bazel_env/bin/helm
          # the repository's values.yaml keeps an empty digest; the packaged one pins the harness
          cp -r deploy/helm/dark-factory "$RUNNER_TEMP/dark-factory"
          build/with_tools.sh yq -i '.image.harness.claudeCode.digest = strenv(HARNESS_DIGEST) | .image.harness.opencode.digest = strenv(OPENCODE_DIGEST)' "$RUNNER_TEMP/dark-factory/values.yaml"
          build/with_tools.sh helm package "$RUNNER_TEMP/dark-factory" --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/out"

      - name: Push the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | build/with_tools.sh helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
          build/with_tools.sh helm push "$RUNNER_TEMP/out/dark-factory-$VERSION.tgz" oci://ghcr.io/prskr/dark-factory/charts

  # Everything is pushed: only now the tag and the release exist
  publish:
    needs: [version, images, reference-images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and release
    steps:
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$VERSION" --generate-notes

  # The tag exists: build the docs from the released commit and publish them. Re-run this job alone
  # when it fails; publishing the same version again replaces its directory.
  docs:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    # Not shared with the main publish: GitHub cancels a pending run when a newer one queues in the
    # same group, which would drop the docs of a release. Both publishers push with a retry
    # (.github/actions/publish-docs), so they cannot overwrite each other's paths.
    concurrency:
      group: gh-pages-release
      cancel-in-progress: false
    env:
      # BuildBuddy remote cache, as in ci.yaml (docs/development.md); no platform flag, bazel_env builds for the host.
      BAZEL_ARGS: >-
        --config=cache --config=ci
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          lfs: true # landing page screenshots (docs/landing/images)

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - uses: ./.github/actions/publish-docs
        with:
          mode: release
          version: ${{ needs.version.outputs.version }}
          token: ${{ github.token }}
