name: CI

on:
  pull_request:
    # Planning documents don't affect the build; spec changes are checked by openspec.yaml
    paths-ignore:
      - "product/**"
      - "design/**"
      - "openspec/**"
  # Runs on main save the caches (Bazelisk, repository cache) that every pull request can restore;
  # caches saved by a pull request are only visible to that pull request.
  push:
    branches: [main]
    paths-ignore:
      - "product/**"
      - "design/**"
      - "openspec/**"

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-latest
    env:
      # BuildBuddy remote execution (`rbe` includes the remote cache), see docs/development.md and ADR-0058. The
      # tests that start containers run on this runner. To go back to the remote cache only, replace `rbe` with
      # `cache`. The explicit platform matches the amd64 image's, so tests and images share one build.
      BAZEL_ARGS: >-
        --config=rbe --config=ci --config=linux-amd64-musl
        --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          # Base image manifests (see docs/development.md): avoids registry rate limits on every run
          repository-cache: true

      # testcontainers belongs in dev-dependencies only (crate `df-test-postgres`)
      - name: No testcontainers in the production binary
        run: |
          deps="$(bazel query 'deps(//crates/dark-factory:dark-factory)' 2>/dev/null)"
          if grep -q testcontainers <<<"$deps"; then
            echo "testcontainers is a dependency of //crates/dark-factory:dark-factory" >&2
            exit 1
          fi

      # A database test without the tag `no-remote-exec` would run on a worker without a container runtime
      - name: Database tests run on the runner
        run: build/check_no_remote_exec.sh

      # Static musl binaries for the runner's arch; the images add the cross-compiled arm64 binaries
      - name: Test
        run: bazel test $BAZEL_ARGS //...

      - name: Clippy
        run: bazel build $BAZEL_ARGS --config=lint //crates/... //plugins/...

      - name: Rustfmt
        run: bazel build $BAZEL_ARGS --config=fmt //crates/... //plugins/...

      # The pre-commit hook checks staged files only and can be skipped (rebase, --no-verify); this checks all.
      - name: Buildifier
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -r "$PWD"

      # xtask is its own Cargo workspace outside Bazel. Bazel's cargo cannot compile it (its toolchain has
      # no std for the host's gnu target), so these use the rustup toolchain pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # ~/.cargo and tools/xtask/target; saved on main only (see `push` above)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/xtask -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Repository checks
        run: |
          cargo xtask check-crates
          cargo xtask check-file-length
          cargo xtask check-test-names

      # Neither the Bazel lint run nor the workspace clippy run covers xtask.
      - name: Clippy (xtask)
        run: cargo clippy --manifest-path tools/xtask/Cargo.toml --all-targets -- -D warnings

      # Same command and version as the `web-typecheck` hook in lefthook.yml; Renovate updates both in one PR.
      - name: Type-check web scripts
        run: npx --yes -p typescript@7.0.2 tsc -p crates/df-web

      # The entry of the editor bundle imports the CodeMirror packages, so their types must be installed
      # first (no install script runs, pnpm-workspace.yaml). The `web-typecheck` hook skips this check
      # without `crates/df-web/node_modules`.
      - name: Type-check the editor bundle entry
        working-directory: crates/df-web
        run: |
          npx --yes pnpm install --frozen-lockfile
          npx --yes -p typescript@7.0.2 tsc -p editor
