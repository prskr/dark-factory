name: Update tools

# Regenerates multitool.lock.json from the latest upstream releases (`cargo xtask update-tools`) and opens or
# updates one pull request when it changed. Renovate does not manage this file. A release whose assets no
# longer match `TOOLS` in tools/xtask (a dropped platform, a renamed archive) fails the run.
on:
  schedule:
    # daily, after Renovate (03:17 UTC)
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-tools
  cancel-in-progress: false

jobs:
  update-tools:
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/update-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # rustup toolchain of rust-toolchain.toml, as in ci.yaml
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/xtask -> target

      - name: Regenerate multitool.lock.json
        run: cargo xtask update-tools
        env:
          # read-only, only against the API rate limit
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open or update the pull request
        env:
          # Renovate's fine-grained PAT (renovate.yaml): pull requests opened with GITHUB_TOKEN trigger no CI runs.
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if git diff --quiet -- multitool.lock.json; then
            echo "multitool.lock.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "build(tools): update pinned tools" -- multitool.lock.json
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "build(tools): update pinned tools" \
              --body "Generated by the \`Update tools\` workflow (\`cargo xtask update-tools\`)."
          fi
