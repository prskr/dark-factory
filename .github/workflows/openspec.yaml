name: OpenSpec

on:
  pull_request:
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Validates the main specs and all active changes (archived changes are not validated)
      - name: Validate
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive
