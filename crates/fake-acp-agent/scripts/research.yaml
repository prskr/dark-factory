# Script of the artifact scenario of the e2e suite (project `RS`, no webhook): one script serves
# the coordinator and the researcher, told apart by markers in their prompts. No key is predicted:
# the coordinator saves the key of the researcher (`${researcher}`, kept in the working directory
# for its later turns), so the scenario repeats against the same database. Every turn plays the
# same `when` blocks, because a woken coordinator may be a live or a resumed session.
#
# 1. `[coordinator]` creates the researcher.
# 2. The researcher writes `findings.md` as an artifact and completes.
# 3. The coordinator is woken by a message that lists `<researcher>/findings.md` and reads the
#    artifact.
sessions:
  new:
    - &turn
      - when:
          prompt_contains: "[coordinator]"
          steps:
            - mcp:
                server: factory
                tool: create_task
                args:
                  persona: e2e
                  title: Greeting research
                  prompt: "[research] Find out why the login loops."
                save:
                  researcher: /key
            - say: "Delegated the research; waiting for it."
      - when:
          prompt_contains: "[research]"
          steps:
            - say: "Writing down what I found."
            - mcp:
                server: factory
                tool: write_artifact
                args:
                  name: findings.md
                  content: "# Findings\n\nThe session cookie is dropped on the redirect.\n"
            - mcp:
                server: factory
                tool: complete_task
                args:
                  summary: "Findings are in findings.md."
      - when:
          prompt_contains: "/findings.md"
          steps:
            - mcp:
                server: factory
                tool: read_artifact
                args:
                  task: "${researcher}"
                  name: findings.md
            - say: "Read the findings."
      - end: end_turn
    - *turn
    - *turn
  loaded:
    - *turn
    - *turn
    - *turn
