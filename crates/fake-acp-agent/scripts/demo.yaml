# Script of the iteration 1 demo (docs/demo.md): the e2e suite and `just seed` point the project's
# adapter command at /opt/harness/scripts/demo.yaml. Commits use the identity of the runtime-owned
# `.git/config`: the Git proxy rejects any other (`df:identity`).
sessions:
  # Run 1: first commit, then shape the pull request and comment on the issue.
  new:
    - - say: "I will add a greeting file for this task."
      # Model traffic goes through the gateway's inference endpoint; the e2e suite checks the
      # answer of the fake upstream and the usage record.
      - model:
          prompt: "Say hello."
      - plan:
          entries:
            - content: "Write greeting.txt"
              status: completed
            - content: "Rephrase the pull request"
              status: pending
      - shell: |
          printf 'hello from the demo agent\n' > greeting.txt
          git add greeting.txt
          git commit -q -m 'Add greeting'
      - mcp:
          server: factory
          tool: update_pull_request
          args:
            title: "Add a greeting"
            body: "Adds greeting.txt, written by the demo agent."
      - mcp:
          server: factory
          tool: comment_on_issue
          args:
            body: "First pass pushed; waiting for feedback."
      - say: "Pushed the greeting. Tell me what to change."
      - end: end_turn
  # Run 2 (after a follow-up message): a second commit on the same branch, a reply in the first
  # review thread (the e2e suite adds a line comment before the follow-up), then done.
  loaded:
    - - say: "Adding the requested test."
      - shell: |
          printf 'greeting is present\n' > greeting_test.txt
          git add greeting_test.txt
          git commit -q -m 'Add greeting test'
      - mcp:
          server: factory
          tool: read_pull_request_feedback
          save:
            thread: /threads/0/id
      - mcp:
          server: factory
          tool: comment_on_pull_request
          args:
            body: "Added greeting_test.txt."
            thread: "${thread}"
      - mcp:
          server: factory
          tool: complete_task
          args:
            summary: "Added greeting.txt and a test for it."
      - end: end_turn
