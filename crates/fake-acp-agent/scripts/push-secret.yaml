# Script of demo step 2 of iteration 2 (docs/demo.md): run 1 commits a GitHub token, the Git
# proxy rejects the push with `df:secret-scan`. The `push.rejected` message makes the agent remove
# the token and amend its unpushed commit, so the next push passes. The token is assembled when the
# shell runs, so this file holds no string a secret scanner matches (`df_e2e::data::test_token`).
sessions:
  new:
    - - say: "Adding the deploy configuration."
      - shell: |
          printf '# Deploy settings\nTOKEN = "%s_%s"\n' ghp E2eTestOnlyNotARealToken000000000000 > config.py
          git add config.py
          git commit -q -m 'Add deploy configuration'
      - say: "Committed config.py."
      - end: end_turn
    # The `push.rejected` message: the next prompt of this session if it is queued before the run
    # is released, otherwise the first turn of the resumed session (`loaded`, same steps).
    - - say: "Removing the token from config.py."
      - shell: |
          if grep -q E2eTestOnly config.py; then
            printf '# Deploy settings\nimport os\nTOKEN = os.environ["DEPLOY_TOKEN"]\n' > config.py
            git add config.py
            git commit -q --amend --no-edit
          fi
      - say: "Amended the unpushed commit; config.py reads the token from the environment."
      - end: end_turn
  loaded:
    - - say: "Removing the token from config.py."
      - shell: |
          if grep -q E2eTestOnly config.py; then
            printf '# Deploy settings\nimport os\nTOKEN = os.environ["DEPLOY_TOKEN"]\n' > config.py
            git add config.py
            git commit -q --amend --no-edit
          fi
      - say: "Amended the unpushed commit; config.py reads the token from the environment."
      - end: end_turn
