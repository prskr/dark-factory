# Script of demo step 4 of iteration 2 (docs/demo.md): the proxy denies pypi.org until the board
# member approves the `network-access` request; the fetch retries once a second in the same turn.
# The held fetch also keeps the turn open for the questions of
# `[conversation-flow]` and `[blocking-question]` tasks
# (crates/df-e2e/tests/flow.rs).
sessions:
  new:
    - - say: "I need the package index from pypi.org."
      - when:
          prompt_contains: "[conversation-flow]"
          steps:
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Which inputs should the next turn receive?"
                  kind: text
                  blocking: false
      - when:
          prompt_contains: "[blocking-question]"
          steps:
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Which greeting should the file contain?"
                  kind: text
                  blocking: true
      # Question kinds (crates/df-e2e/tests/questions.rs): the held fetch below keeps the turn
      # open while the board member answers.
      - when:
          prompt_contains: "[kind-single]"
          steps:
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Which PostgreSQL version should the chart default to?"
                  kind: single_choice
                  options:
                    - { id: pg16, label: "PostgreSQL 16", description: "Supported until 2028" }
                    - { id: pg17, label: "PostgreSQL 17" }
                  blocking: true
      - when:
          prompt_contains: "[kind-choices]"
          steps:
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Which parts does the change touch?"
                  kind: multi_choice
                  options:
                    - { id: api, label: "API" }
                    - { id: ui, label: "UI" }
                    - { id: cli, label: "CLI" }
                    - { id: docs, label: "Docs" }
                  max_selected: 2
                  blocking: true
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Why did the build fail?"
                  kind: text
                  blocking: true
      - when:
          prompt_contains: "[kind-drafts]"
          steps:
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Describe the rollout."
                  kind: text
                  blocking: true
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Which environments get it first?"
                  kind: multi_choice
                  options:
                    - { id: dev, label: "Dev" }
                    - { id: stage, label: "Stage" }
                    - { id: prod, label: "Prod" }
                  blocking: true
      - fetch:
          url: https://pypi.org/simple/pip/
          timeout_seconds: 240
      - end: end_turn
    # The approval's decision message is queued during the fetch and becomes the next prompt of
    # this session, in the same run.
    - - say: "Noted the decision."
      - when:
          prompt_contains: "E2E Admin:\nPlease keep this queued follow-up with the question answer.\nRequest decision:"
          steps:
            - when:
                prompt_contains: "Both the queued follow-up and this answer."
                steps:
                  - say: "Received the queued follow-up and question answer with author lines."
      - when:
          prompt_contains: '"selected":[{"id":"pg17","label":"PostgreSQL 17"}]'
          steps:
            - say: "Chose pg17 from the JSON block."
      - when:
          prompt_contains: "Hello, blocking world."
          steps:
            - say: "Got the first answer in the same run."
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Should I also add a test?"
                  kind: text
                  blocking: true
      - end: end_turn
  # Run 2 of the blocking-question flow, started by the second answer.
  loaded:
    - - when:
          prompt_contains: "Yes, add a test."
          steps:
            - say: "Continued after the second answer."
      - end: end_turn
