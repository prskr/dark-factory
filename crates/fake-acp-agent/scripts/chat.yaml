# Script of the chat scenario of the e2e suite (project `CH`, `iter3-chats`): one script serves the
# chat and the tasks it creates, told apart by markers in their prompts. No key is predicted: the
# chat saves the key of the implementation (`${impl}`, kept in the working directory for its later
# turns). Every turn plays the same `when` blocks, because a woken chat may be a live or a resumed
# session.
#
# 1. `[chat]` sets the topic, lists the open issues, asks for an issue (`create_issue`, created
#    when a board member approves), creates the implementation and a review that depends on its
#    completion and is linked to issue 1 of the repository, and tries to push from its read-only checkout (the Git proxy rejects it; the
#    output is in the transcript).
# 2. `[chat-impl]` starts and stays in its turn until a board member interrupts it; the message
#    `[chat-finish]` that follows completes the task.
# 3. `[chat-review]` completes when the implementation did.
# 4. The chat is woken by each child; it says what arrived.
sessions:
  new:
    - &turn
      # `[chat-question]` (crates/df-e2e/tests/chat_questions.rs): a blocking choice, and what the
      # chat says when the JSON block of the answer arrives in its next turn.
      - when:
          prompt_contains: "[chat-question]"
          steps:
            - mcp:
                server: factory
                tool: ask_question
                args:
                  text: "Which chart layout do you prefer?"
                  kind: single_choice
                  options:
                    - { id: mono, label: "One chart" }
                    - { id: split, label: "Split charts" }
                  blocking: true
            - say: "Asked about the layout."
      - when:
          prompt_contains: '"selected":[{"id":"split","label":"Split charts"}]'
          steps:
            - say: "The chat got the split layout."
      - when:
          prompt_contains: "[chat]"
          steps:
            - mcp:
                server: factory
                tool: set_task_title
                args:
                  title: Helm chart plan
            - mcp:
                server: factory
                tool: list_issues
                args: {}
            - mcp:
                server: factory
                tool: create_issue
                args:
                  title: E2E chat issue
                  body: "Filed from the e2e chat.\n\nSee [the docs](https://example.org/docs)."
                  labels: []
            - mcp:
                server: factory
                tool: create_task
                args:
                  persona: e2e
                  title: Chat implementation
                  prompt: "[chat-impl] Write the chart."
                save:
                  impl: /key
            - mcp:
                server: factory
                tool: create_task
                args:
                  persona: e2e
                  title: Chat review
                  prompt: "[chat-review] Review the chart."
                  issue: 1
                  depends_on:
                    - task: "${impl}"
                      kind: completion
            - say_shell: "git push origin HEAD:refs/heads/chat-must-not-push 2>&1 || true"
            - say: "Delegated the chart; waiting for the children."
      - when:
          prompt_contains: "[chat-impl]"
          steps:
            - say: "Starting the chart."
            - end: hang
      - when:
          prompt_contains: "[chat-finish]"
          steps:
            - say: "Finished the chart."
            - mcp:
                server: factory
                tool: complete_task
                args:
                  summary: "Chart written."
      - when:
          prompt_contains: "[chat-review]"
          steps:
            - say: "Reviewed the chart."
            - mcp:
                server: factory
                tool: complete_task
                args:
                  summary: "Chart reviewed."
      - when:
          prompt_contains: '"Chat implementation" completed'
          steps:
            - say: "The implementation is in."
      - when:
          prompt_contains: '"Chat review" completed'
          steps:
            - say: "The review is in."
      - end: end_turn
    - *turn
    - *turn
    - *turn
  loaded:
    - *turn
    - *turn
    - *turn
    - *turn
