# Secret rules of the Git proxy's secret scan (crates/df-gateway/README.md, "Secret scanning").
#
# Subset of Kingfisher's rules: crate kingfisher-rules 3.0.1, file generated/rules/betterleaks.yml,
# which Kingfisher converted from Betterleaks revision b1aa878bc41b06583f6ce83bf0ffcc5e6ed8f4f3.
# Modified by Dark Factory: only the rules below, with only their name, id, pattern, keywords and
# confidence (validation, revocation, filters, secret groups and rule dependencies removed).
# License and attribution: NOTICE and LICENSE-APACHE in this directory.
rules:
- name: Discovered a potential Age encryption tool secret key, risking data decryption and unauthorized access to sensitive information.
  id: betterleaks.age-secret-key
  pattern: AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}
  keywords:
  - age-secret-key-1
  confidence: high
- name: Detected an Anthropic Admin API Key, risking unauthorized access to administrative functions and sensitive AI model configurations.
  id: betterleaks.anthropic-admin-api-key
  pattern: \b(sk-ant-admin01-[a-zA-Z0-9_\-]{93}AA)(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - sk-ant-admin01
  confidence: high
- name: Identified an Anthropic API Key, which may compromise AI assistant integrations and expose sensitive data to unauthorized access.
  id: betterleaks.anthropic-api-key
  pattern: \b(sk-ant-api03-[a-zA-Z0-9_\-]{93}AA)(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - sk-ant-api03
  confidence: high
- name: Detected an Atlassian Cloud API token, posing a threat to project management and collaboration tool security and data confidentiality.
  id: betterleaks.atlassian-api-token
  pattern: \b(ATAT[A-Za-z0-9_\-=]{100,})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - atat
  confidence: high
- name: Identified an AWS access key ID paired with a secret access key, which together can provide full access to AWS services.
  id: betterleaks.aws-access-token
  pattern: \b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b
  keywords:
  - a3t
  - akia
  - asia
  - abia
  - acca
  confidence: high
- name: Identified a pattern that may indicate long-lived Amazon Bedrock API keys, risking unauthorized Amazon Bedrock usage
  id: betterleaks.aws-amazon-bedrock-api-key-long-lived
  pattern: \b(ABSK[A-Za-z0-9+/]{109,269}={0,2})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - absk
  confidence: high
- name: Azure AD Client Secret
  id: betterleaks.azure-ad-client-secret
  pattern: (?:^|[\\'"\x60\s>=:(,)])([a-zA-Z0-9_~.]{3}\dQ~[a-zA-Z0-9_~.-]{31,34})(?:$|[\\'"\x60\s<),])
  keywords:
  - 0q~
  - 1q~
  - 2q~
  - 3q~
  - 4q~
  - 5q~
  - 6q~
  - 7q~
  - 8q~
  - 9q~
  confidence: high
- name: Detected an Azure Storage account key.
  id: betterleaks.azure-storage-account-key
  pattern: (?i)\b(?:AccountKey|(?:azure[_\s.-]*)?(?:storage[_\s.-]*)?(?:account[_\s.-]*)?(?:access[_\s.-]*)?key)\b(?s:.{0,24}?)([A-Za-z0-9+/]{86}==)
  keywords:
  - accountkey
  - storage
  - accesskey
  - access_key
  - access-key
  confidence: high
- name: Uncovered a Databricks API token, which may compromise big data analytics platforms and sensitive data processing.
  id: betterleaks.databricks-api-token
  pattern: \b(dapi[a-f0-9]{32}(?:-\d)?)(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - dapi
  confidence: high
- name: Found a DigitalOcean OAuth Access Token, risking unauthorized cloud resource access and data compromise.
  id: betterleaks.digitalocean-access-token
  pattern: \b(doo_v1_[a-f0-9]{64})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - doo_v1_
  confidence: high
- name: Discovered a DigitalOcean Personal Access Token, posing a threat to cloud infrastructure security and data privacy.
  id: betterleaks.digitalocean-pat
  pattern: \b(dop_v1_[a-f0-9]{64})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - dop_v1_
  confidence: high
- name: Uncovered a DigitalOcean OAuth Refresh Token, which could allow prolonged unauthorized access and resource manipulation.
  id: betterleaks.digitalocean-refresh-token
  pattern: (?i)\b(dor_v1_[a-f0-9]{64})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - dor_v1_
  confidence: high
- name: Detected a Docker Hub personal access token, which may expose Docker Hub account access.
  id: betterleaks.dockerhub-personal-access-token
  pattern: \b(dckr_pat_[A-Za-z0-9_-]{27})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - dckr_pat_
  confidence: high
- name: Discovered a Doppler API token, posing a risk to environment and secrets management security.
  id: betterleaks.doppler-api-token
  pattern: dp\.pt\.(?i)[a-z0-9]{43}
  keywords:
  - dp.pt.
  confidence: high
- name: Uncovered a GCP API key, which could lead to unauthorized access to Google Cloud services and data breaches.
  id: betterleaks.gcp-api-key
  pattern: \b(AIza[\w-]{35})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - aiza
  confidence: high
- name: Identified a GitHub App Token, which may compromise GitHub application integrations and source code security.
  id: betterleaks.github-app-token
  pattern: (?:ghu|ghs)_[0-9a-zA-Z]{36}
  keywords:
  - ghu_
  - ghs_
  confidence: high
- name: Found a GitHub Fine-Grained Personal Access Token, risking unauthorized repository access and code manipulation.
  id: betterleaks.github-fine-grained-pat
  pattern: github_pat_\w{82}
  keywords:
  - github_pat_
  confidence: high
- name: Discovered a GitHub OAuth Access Token, posing a risk of compromised GitHub account integrations and data leaks.
  id: betterleaks.github-oauth
  pattern: gho_[0-9a-zA-Z]{36}
  keywords:
  - gho_
  confidence: high
- name: Uncovered a GitHub Personal Access Token, potentially leading to unauthorized repository access and sensitive content exposure.
  id: betterleaks.github-pat
  pattern: ghp_[0-9a-zA-Z]{36}
  keywords:
  - ghp_
  confidence: high
- name: Detected a GitHub Refresh Token, which could allow prolonged unauthorized access to GitHub services.
  id: betterleaks.github-refresh-token
  pattern: ghr_[0-9a-zA-Z]{36}
  keywords:
  - ghr_
  confidence: high
- name: Identified a GitLab CI/CD Job Token, potential access to projects and some APIs on behalf of a user while the CI job is running.
  id: betterleaks.gitlab-cicd-job-token
  pattern: glcbt-[0-9a-zA-Z]{1,5}_[0-9a-zA-Z_-]{20}
  keywords:
  - glcbt-
  confidence: high
- name: Identified a GitLab Deploy Token, risking access to repositories, packages and containers with write access.
  id: betterleaks.gitlab-deploy-token
  pattern: gldt-[0-9a-zA-Z_\-]{20}
  keywords:
  - gldt-
  confidence: high
- name: Identified a GitLab Personal Access Token, risking unauthorized access to GitLab repositories and codebase exposure.
  id: betterleaks.gitlab-pat
  pattern: glpat-[\w-]{20}
  keywords:
  - glpat-
  confidence: high
- name: Identified a GitLab Personal Access Token (routable), risking unauthorized access to GitLab repositories and codebase exposure.
  id: betterleaks.gitlab-pat-routable
  pattern: \bglpat-[0-9a-zA-Z_-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7}\b
  keywords:
  - glpat-
  confidence: high
- name: Found a GitLab Pipeline Trigger Token, potentially compromising continuous integration workflows and project security.
  id: betterleaks.gitlab-ptt
  pattern: glptt-[0-9a-f]{40}
  keywords:
  - glptt-
  confidence: high
- name: Discovered a GitLab Runner Registration Token, posing a risk to CI/CD pipeline integrity and unauthorized access.
  id: betterleaks.gitlab-rrt
  pattern: GR1348941[\w-]{20}
  keywords:
  - gr1348941
  confidence: high
- name: Discovered a GitLab Runner Authentication Token, posing a risk to CI/CD pipeline integrity and unauthorized access.
  id: betterleaks.gitlab-runner-authentication-token
  pattern: glrt-[0-9a-zA-Z_\-]{20}
  keywords:
  - glrt-
  confidence: high
- name: Discovered a GitLab Runner Authentication Token (Routable), posing a risk to CI/CD pipeline integrity and unauthorized access.
  id: betterleaks.gitlab-runner-authentication-token-routable
  pattern: \bglrt-t\d_[0-9a-zA-Z_\-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7}\b
  keywords:
  - glrt-
  confidence: high
- name: Found a Grafana cloud API token, risking unauthorized access to cloud-based monitoring services and data exposure.
  id: betterleaks.grafana-cloud-api-token
  pattern: \b(glc_[A-Za-z0-9+/]{40,150}={0,2})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - glc_
  confidence: high
- name: Discovered a Grafana service account token, posing a risk of compromised monitoring services and data integrity.
  id: betterleaks.grafana-service-account-token
  pattern: \b(glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - glsa_
  confidence: high
- name: Uncovered a HashiCorp Terraform user/org API token, which may lead to unauthorized infrastructure management and security breaches.
  id: betterleaks.hashicorp-tf-api-token
  pattern: (?i)[a-z0-9]{14}\.(?-i:atlasv1)\.[a-z0-9\-_=]{60,70}
  keywords:
  - atlasv1
  confidence: high
- name: Detected a Heroku API Key, potentially compromising cloud application deployments and operational security.
  id: betterleaks.heroku-api-key-v2
  pattern: \b((HRKU-AA[0-9a-zA-Z_-]{58}))(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - hrku-aa
  confidence: high
- name: Discovered a Hugging Face Access token, which could lead to unauthorized access to AI models and sensitive data.
  id: betterleaks.huggingface-access-token
  pattern: \b(hf_(?i:[a-z]{34}))(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - hf_
  confidence: high
- name: Detected a Linear API Token, posing a risk to project management tools and sensitive task data.
  id: betterleaks.linear-api-key
  pattern: lin_api_(?i)[a-z0-9]{40}
  keywords:
  - lin_api_
  confidence: high
- name: Found a Mailgun private API token, risking unauthorized email service operations and data breaches.
  id: betterleaks.mailgun-private-api-token
  pattern: (?i)(?:mailgun)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}(key-[a-f0-9]{32})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - mailgun
  confidence: high
- name: Uncovered an npm access token, potentially compromising package management and code repository access.
  id: betterleaks.npm-access-token
  pattern: (?i)\b(npm_[a-z0-9]{36})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - npm_
  confidence: high
- name: Found an OpenAI API Key, posing a risk of unauthorized access to AI services and data manipulation.
  id: betterleaks.openai-api-key
  pattern: \b(sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58}|[A-Za-z0-9_-]{20})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58}|[A-Za-z0-9_-]{20})\b|sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - t3blbkfj
  confidence: high
- name: Uncovered a Postman API token, potentially compromising API testing and development workflows.
  id: betterleaks.postman-api-token
  pattern: \b(PMAK-(?i)[a-f0-9]{24}\-[a-f0-9]{34})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - pmak-
  confidence: high
- name: Identified a Private Key, which may compromise cryptographic security and sensitive data encryption.
  id: betterleaks.private-key
  pattern: '(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]*?-----END[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'
  keywords:
  - '-----begin'
  confidence: high
- name: Found a Pulumi API token, posing a risk to infrastructure as code services and cloud resource management.
  id: betterleaks.pulumi-api-token
  pattern: \b(pul-[a-f0-9]{40})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - pul-
  confidence: high
- name: Discovered a PyPI upload token, potentially compromising Python package distribution and repository integrity.
  id: betterleaks.pypi-upload-token
  pattern: pypi-AgEIcHlwaS5vcmc[\w-]{50,1000}
  keywords:
  - pypi-ageichlwas5vcmc
  confidence: high
- name: Detected a SendGrid API token, posing a risk of unauthorized email service operations and data exposure.
  id: betterleaks.sendgrid-api-token
  pattern: \b(SG\.(?i)[a-z0-9=_\-\.]{66})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - sg.
  confidence: high
- name: Uncovered a Shopify access token, which could lead to unauthorized e-commerce platform access and data breaches.
  id: betterleaks.shopify-access-token
  pattern: shpat_[a-fA-F0-9]{32}
  keywords:
  - shpat_
  confidence: high
- name: Detected a Shopify custom access token, potentially compromising custom app integrations and e-commerce data security.
  id: betterleaks.shopify-custom-access-token
  pattern: shpca_[a-fA-F0-9]{32}
  keywords:
  - shpca_
  confidence: high
- name: Identified a Shopify private app access token, risking unauthorized access to private app data and store operations.
  id: betterleaks.shopify-private-app-access-token
  pattern: shppa_[a-fA-F0-9]{32}
  keywords:
  - shppa_
  confidence: high
- name: Found a Shopify shared secret, posing a risk to application authentication and e-commerce platform security.
  id: betterleaks.shopify-shared-secret
  pattern: shpss_[a-fA-F0-9]{32}
  keywords:
  - shpss_
  confidence: high
- name: Detected a Slack App-level token, risking unauthorized access to Slack applications and workspace data.
  id: betterleaks.slack-app-token
  pattern: (?i)xapp-\d-[A-Z0-9]+-\d+-[a-z0-9]+
  keywords:
  - xapp
  confidence: high
- name: Identified a Slack Bot token, which may compromise bot integrations and communication channel security.
  id: betterleaks.slack-bot-token
  pattern: xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*
  keywords:
  - xoxb
  confidence: high
- name: Found a Slack Configuration access token, posing a risk to workspace configuration and sensitive data access.
  id: betterleaks.slack-config-access-token
  pattern: (?i)xoxe.xox[bp]-\d-[A-Z0-9]{163,166}
  keywords:
  - xoxe.xoxb-
  - xoxe.xoxp-
  confidence: high
- name: Discovered a Slack Configuration refresh token, potentially allowing prolonged unauthorized access to configuration settings.
  id: betterleaks.slack-config-refresh-token
  pattern: (?i)xoxe-\d-[A-Z0-9]{146}
  keywords:
  - xoxe-
  confidence: high
- name: Uncovered a Slack Legacy bot token, which could lead to compromised legacy bot operations and data exposure.
  id: betterleaks.slack-legacy-bot-token
  pattern: xoxb-[0-9]{8,14}-[a-zA-Z0-9]{18,26}
  keywords:
  - xoxb
  confidence: high
- name: Detected a Slack Legacy token, risking unauthorized access to older Slack integrations and user data.
  id: betterleaks.slack-legacy-token
  pattern: xox[os]-\d+-\d+-\d+-[a-fA-F\d]+
  keywords:
  - xoxo
  - xoxs
  confidence: high
- name: Identified a Slack Legacy Workspace token, potentially compromising access to workspace data and legacy features.
  id: betterleaks.slack-legacy-workspace-token
  pattern: xox[ar]-(?:\d-)?[0-9a-zA-Z]{8,48}
  keywords:
  - xoxa
  - xoxr
  confidence: high
- name: Found a Slack User token, posing a risk of unauthorized user impersonation and data access within Slack workspaces.
  id: betterleaks.slack-user-token
  pattern: xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}
  keywords:
  - xoxp-
  - xoxe-
  confidence: high
- name: Discovered a Slack Webhook, which could lead to unauthorized message posting and data leakage in Slack channels.
  id: betterleaks.slack-webhook-url
  pattern: (?:https?://)?hooks.slack.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}
  keywords:
  - hooks.slack.com
  confidence: high
- name: Found a Stripe Access Token, posing a risk to payment processing services and sensitive financial data.
  id: betterleaks.stripe-access-token
  pattern: \b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99})(?:\\?['"\x60]|[\s;]|\\[nr]|$)
  keywords:
  - sk_test
  - sk_live
  - sk_prod
  - rk_test
  - rk_live
  - rk_prod
  confidence: high
