[package]
name = "df-agent-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# PKI and scripted runtime client for tests of this and dependent crates.
test-util = [
    "dep:tempfile",
    "df-core/test-util",
    "df-orchestrator/test-util",
    "df-tls/test-util",
]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
df-core.workspace = true
df-db.workspace = true
df-orchestrator.workspace = true
df-proto.workspace = true
df-sandbox-contract.workspace = true
df-tls.workspace = true
futures.workspace = true
jsonschema.workspace = true
opentelemetry.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
bytes.workspace = true
df-agent-channel = { path = ".", features = ["test-util"] }
df-core = { workspace = true, features = ["test-util"] }
df-telemetry = { workspace = true, features = ["test-util"] }
df-test-postgres.workspace = true
df-tls = { workspace = true, features = ["test-util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
