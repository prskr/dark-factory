// Dark Factory gateway link, v1 (iter1-egress-gateway design D1).
//
// Internal gRPC API between the control plane and the egress gateway pods, both directions on
// the internal port (9444) with mutual TLS; peers authenticate with certificates issued by the
// instance CA.
//
//   * GatewayPolicy (served by the control plane): the gateway opens PolicyWatch and receives
//     the sandbox registry and every run's effective allowlist. Every update is a full snapshot.
//   * GatewayLog (served by each gateway pod): the control plane opens Tail to read the flow
//     events of the egress proxy, buffered ones first, then live ones.
//   * GatewayGit (served by the control plane): the Git proxy of a gateway pod records every
//     push of a sandbox with RecordPush (iter2-git-proxy design D1), including the findings of
//     its push checks (iter2-push-checks design D2).
//   * GatewayEvents (served by the control plane): the egress proxy reports `not-allowlisted`
//     denials with ReportDenial (iter2-egress-approvals design D2).
//   * GatewayUsage (served by the control plane): the inference endpoint reports the token usage
//     of every model request with Report (iter3-inference-gateway design D4).
//
// Versions of PolicyUpdate increase monotonically (a database sequence). A gateway that sees a
// gap or reconnects replaces its policy with the next snapshot it receives and enforces its last
// snapshot while it has none.

syntax = "proto3";

package darkfactory.gateway.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service GatewayPolicy {
  // Streams a full snapshot on connect and a new one after every relevant change.
  rpc PolicyWatch(PolicyWatchRequest) returns (stream PolicyUpdate);
}

service GatewayLog {
  // Streams the buffered events matching the filter, then live events until the client leaves.
  rpc Tail(TailRequest) returns (stream FlowEvent);
}

service GatewayGit {
  // Stores or advances the record of a push. Idempotent by `push_id`; a call that would move the
  // verdict backwards is ignored.
  rpc RecordPush(PushRecord) returns (RecordPushResponse);
}

service GatewayEvents {
  // Reports a `not-allowlisted` denial of a sandbox. Sent at most once per minute per run, host
  // and port, fire-and-forget; the control plane may raise a `network-access` request from it.
  rpc ReportDenial(Denial) returns (ReportDenialResponse);
}

service GatewayUsage {
  // Stores the usage records of a batch. Idempotent by `UsageRecord.request_id`: a record that is
  // already stored is ignored; records of unknown runs are dropped.
  rpc Report(UsageBatch) returns (ReportUsageResponse);
}

// ---------------------------------------------------------------------------
// Policy
// ---------------------------------------------------------------------------

message PolicyWatchRequest {
  // Name of the calling gateway pod, for logs.
  string gateway_pod = 1;
}

message PolicyUpdate {
  uint64 version = 1;
  Snapshot snapshot = 2;
}

message Snapshot {
  repeated SandboxEntry sandboxes = 1;
  // Credentials of the forges the Git routes push to, keyed by `GitRoute.credential_ref`.
  map<string, ForgeCredential> forge_credentials = 2;
  // Push checks of the projects in `sandboxes`, keyed by `SandboxEntry.project_key`. Every such
  // project has an entry; the control plane fills in the defaults for a project without a stored
  // policy.
  map<string, PushPolicy> push_policies = 3;
  // Credentials of the model providers the inference routes use, keyed by
  // `InferenceRoute.credential_ref`.
  map<string, ProviderCredential> provider_credentials = 4;
}

// An active sandbox: where its traffic comes from and what it may reach.
message SandboxEntry {
  string pod_ip = 1;
  string run_id = 2;
  string task_key = 3;
  string project_key = 4;
  string persona_id = 5;
  repeated HostRule hosts = 6;
  // The run's number within its task (`#2`); 0 if unknown.
  uint32 run_number = 7;
  // The repository the run may fetch from and push to through the Git proxy; unset if none.
  GitRoute git = 8;
  // Fingerprints of the push check findings approved for the run's task
  // (`PushFinding.fingerprint`); a push passes findings with a listed fingerprint.
  repeated string exceptions = 9;
  // The model provider the run's harness talks to through the inference endpoint; unset if none.
  InferenceRoute inference = 10;
}

// The API protocol of a model endpoint.
enum WireApi {
  WIRE_API_UNSPECIFIED = 0;
  // Anthropic Messages: `/v1/messages`, `/v1/messages/count_tokens`, `/v1/models`.
  WIRE_API_ANTHROPIC_MESSAGES = 1;
  // OpenAI Chat Completions: `/v1/chat/completions`, `/v1/models`.
  WIRE_API_OPENAI_CHAT = 2;
  // OpenAI Responses: `/v1/responses`, `/v1/models`.
  WIRE_API_OPENAI_RESPONSES = 3;
}

// How the gateway presents the provider credential to the upstream.
enum CredentialScheme {
  CREDENTIAL_SCHEME_UNSPECIFIED = 0;
  // `x-api-key: <value>`
  CREDENTIAL_SCHEME_X_API_KEY = 1;
  // `Authorization: Bearer <value>`
  CREDENTIAL_SCHEME_BEARER = 2;
  // `<credential_header>: <credential_prefix><value>`
  CREDENTIAL_SCHEME_HEADER = 3;
  // `Authorization: Bearer <value>`; Anthropic Messages only.
  CREDENTIAL_SCHEME_CLAUDE_SUBSCRIPTION = 4;
}

// A run's model provider (iter3-inference-gateway design D8). The gateway does no templating:
// `headers` are rendered for the run.
message InferenceRoute {
  // The wire API chosen for the run; `/v1/models` goes to its upstream.
  WireApi wire_api = 1;
  // Upstream base URL per wire API the provider offers, `https://` only.
  repeated ApiUpstream upstreams = 2;
  // Key into `Snapshot.provider_credentials`.
  string credential_ref = 3;
  CredentialScheme scheme = 4;
  // Header name and value prefix of `CREDENTIAL_SCHEME_HEADER`.
  string credential_header = 5;
  string credential_prefix = 6;
  // Extra headers the provider sets for the run; they replace client headers of the same name.
  repeated Header headers = 7;
}

message ApiUpstream {
  WireApi wire_api = 1;
  string upstream_url = 2;
}

message Header {
  string name = 1;
  string value = 2;
}

// Credential value of a model provider. Secret: never logged; the Rust `Debug` redacts `value`.
message ProviderCredential {
  string value = 1;
}

// A run's repository behind the Git proxy. Branches are full ref names (`refs/heads/main`).
message GitRoute {
  // The project repository upstream, `https://` only.
  string upstream_url = 1;
  // The branch the task branch is based on, e.g. `refs/heads/main`.
  string base_branch = 2;
  // `refs/heads/factory/task/<KEY>`.
  string task_branch = 3;
  // `refs/heads/factory/wip/<KEY>`.
  string wip_branch = 4;
  // Key into `Snapshot.forge_credentials`.
  string credential_ref = 5;
  // Identity the agent's commits must carry (checked by iter2-push-checks).
  string commit_name = 6;
  string commit_email = 7;
}

// Basic auth credential for a forge. Secret: never logged; the Rust `Debug` redacts `password`.
message ForgeCredential {
  string username = 1;
  string password = 2;
}

// A project's push checks (iter2-push-checks design D4). Always on and not listed here: the
// commit identity and `.dark-factory/**` as a protected path, both with mode `REJECT`.
message PushPolicy {
  // Protected path globs (`globset` syntax; `*` does not match `/`), e.g. `.forgejo/workflows/**`.
  repeated string protected_globs = 1;
  CheckMode protected_mode = 2;
  CheckMode secret_mode = 3;
  CheckMode size_mode = 4;
  // Largest blob a push may add, in bytes.
  uint64 max_blob_bytes = 5;
  // Merge commits are rejected (`df:merge-commit`, mode `REJECT`).
  bool linear_history = 6;
  // Hidden path globs (same syntax as `protected_globs`, no `{}`). A push touching one is a
  // `df:hidden-path` finding with mode `REJECT`, on the task and the WIP branch.
  repeated string hidden_globs = 7;
}

// What a finding of a check does to a push on the task branch. Pushes to the WIP branch treat
// every finding as `REJECT`.
enum CheckMode {
  // Treated as `REJECT`.
  CHECK_MODE_UNSPECIFIED = 0;
  // The push is rejected.
  CHECK_MODE_REJECT = 1;
  // The push is rejected unless the task has an exception for the finding; without one, a human
  // can approve it (`push-check-exception` request).
  CHECK_MODE_APPROVAL = 2;
}

message HostRule {
  // Hostname or `*.suffix`.
  string pattern = 1;
  uint32 port = 2;
  // `instance`, `project` or `task`.
  string scope = 3;
  string entry_id = 4;
}

// ---------------------------------------------------------------------------
// Flow log
// ---------------------------------------------------------------------------

message TailRequest {
  // Only events matching every set field are sent; an empty filter matches all.
  FlowFilter filter = 1;
}

message FlowFilter {
  Verdict verdict = 1;
  string project_key = 2;
  string task_key = 3;
  string persona_id = 4;
  // Substring of the requested host.
  string host = 5;
}

// Which end of a connection an event records. A tunnel or plain HTTP exchange that was carried
// out records an `OPENED` event once the destination is connected and a `CLOSED` event when it
// ends. A denied request records only the `CLOSED` event.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_OPENED = 1;
  PHASE_CLOSED = 2;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOWED = 1;
  VERDICT_DENIED = 2;
}

// One proxy request. Two markers carry no request: `gap` tells a viewer that its stream lagged
// and events were dropped, `backlog_end` follows the last buffered event of a Tail stream (live
// events come after it).
message FlowEvent {
  // When the event was recorded (the opening or the end of the connection).
  google.protobuf.Timestamp time = 1;
  string gateway_pod = 2;
  string source_ip = 3;
  string run_id = 4;
  string task_key = 5;
  string project_key = 6;
  string persona_id = 7;
  // `CONNECT` or the HTTP method.
  string method = 8;
  string host = 9;
  uint32 port = 10;
  string sni = 11;
  Verdict verdict = 12;
  // Empty for requests that were carried out. Otherwise:
  //   `no-snapshot`           the gateway has no policy yet (503)
  //   `unknown-source`        the source IP is no active sandbox (403), also for a tunnel whose
  //                           sandbox left the registry
  //   `ip-literal`            destination is an IP address (403)
  //   `not-allowlisted`       no entry of the run matches host and port (403)
  //   `private-destination`   the name resolves to a blocked range (403)
  //   `sni-mismatch`          the ClientHello has no SNI or another one than the CONNECT host
  //   `removed-from-allowlist` an open tunnel was closed because its host left the allowlist
  //   `gateway-shutdown`      an open tunnel was closed because the gateway stopped
  //   `resolve-failed`        the name did not resolve (502)
  //   `upstream-failed`       connecting to or talking with the destination failed (502)
  //   `upstream-timeout`      the destination did not answer in time (502)
  //   `tunnel-error`          the tunnel ended with an I/O error
  string reason = 13;
  // Pattern of the allowlist entry that allowed the request.
  string matched_rule = 14;
  uint64 bytes_in = 15;
  uint64 bytes_out = 16;
  google.protobuf.Duration duration = 17;
  // Status of the upstream response of plain HTTP requests, 0 otherwise.
  uint32 http_status = 18;
  bool gap = 19;
  bool backlog_end = 20;
  Phase phase = 21;
  // Identifies the request among those of this gateway pod; the opened and the closed event of
  // one request have the same id. 0 if unset.
  uint64 flow_id = 22;
  // The run's number within its task (`#2`); 0 if unknown (an older gateway).
  uint32 run_number = 23;
}

// ---------------------------------------------------------------------------
// Git pushes
// ---------------------------------------------------------------------------

// Outcome of a push or of one of its ref updates. A verdict only moves forward:
// `FORWARDING` → `ACCEPTED` | `UPSTREAM_FAILED`; `REJECTED`, `ACCEPTED` and `UPSTREAM_FAILED` are
// final.
enum PushVerdict {
  PUSH_VERDICT_UNSPECIFIED = 0;
  // Passed the gateway's checks; being sent upstream.
  PUSH_VERDICT_FORWARDING = 1;
  // Upstream accepted it.
  PUSH_VERDICT_ACCEPTED = 2;
  // The gateway rejected it; nothing reached upstream.
  PUSH_VERDICT_REJECTED = 3;
  // Forwarding failed or upstream rejected it.
  PUSH_VERDICT_UPSTREAM_FAILED = 4;
}

message PushRecord {
  // UUIDv7 chosen by the gateway; idempotency key of the record.
  string push_id = 1;
  string run_id = 2;
  string gateway_pod = 3;
  // One entry per command of the push, in command order.
  repeated RefUpdate refs = 4;
  PushVerdict verdict = 5;
  // Size of the pushed pack.
  uint64 bytes = 6;
  // From the start of the push to this verdict.
  google.protobuf.Duration duration = 7;
  // Findings of the push checks without a matching exception, of every ref; empty unless
  // `REJECTED` by a check.
  repeated PushFinding findings = 8;
  // `REJECTED` on the task branch only by `APPROVAL` findings; the control plane raises a
  // `push-check-exception` request for them.
  bool approval_requested = 9;
}

// One finding of a push check (iter2-push-checks design D2). Never contains a matched secret.
message PushFinding {
  // Full name of the ref whose added commits produced the finding.
  string ref = 1;
  PushCheck check = 2;
  // The mode applied: always `REJECT` for the identity, `.dark-factory/**`, merge commits and the
  // WIP branch.
  CheckMode mode = 3;
  // Key of an exception: `secret:<rule>:<blob>:<line>`, `path:<path>` or `size:<path>:<blob>`
  // (`<blob>` is the hex object id); unset for identity and merge commit findings.
  optional string fingerprint = 4;
  // Path in the repository; empty for identity and merge commit findings.
  string path = 5;
  // 1-based line of a secret.
  optional uint32 line = 6;
  // Masked, human-readable detail, e.g. the rule and the masked match of a secret or the size of
  // a blob.
  string detail = 7;
  // What a `SECRET_SCAN` finding matched; unset for the other checks.
  MaskedSecret secret = 8;
}

// A secret a push check found, without the secret.
message MaskedSecret {
  // Id of the rule that matched, e.g. `betterleaks.github-pat`.
  string rule = 1;
  // The match with all but its first characters masked.
  string masked = 2;
}

// The checks of a push. `PushFinding.check` and the `df:` reason of a rejected ref name the same
// check.
enum PushCheck {
  PUSH_CHECK_UNSPECIFIED = 0;
  // `df:secret-scan`
  PUSH_CHECK_SECRET_SCAN = 1;
  // `df:identity`: author or committer email differs from `GitRoute.commit_email`.
  PUSH_CHECK_IDENTITY = 2;
  // `df:protected-path`
  PUSH_CHECK_PROTECTED_PATH = 3;
  // `df:blob-too-large`
  PUSH_CHECK_BLOB_TOO_LARGE = 4;
  // `df:merge-commit`
  PUSH_CHECK_MERGE_COMMIT = 5;
  // `df:hidden-path`
  PUSH_CHECK_HIDDEN_PATH = 6;
}

message RefUpdate {
  // Full ref name, e.g. `refs/heads/factory/task/DF-7`.
  string name = 1;
  // Hex object ids; all zeros for a create (`old_sha`) or a delete (`new_sha`).
  string old_sha = 2;
  string new_sha = 3;
  PushVerdict verdict = 4;
  // Empty unless rejected or failed: a gateway rule (`df:ref-not-allowed`,
  // `df:non-fast-forward`, `df:other-ref-rejected`, ...) or the push checks' reason
  // (`df:secret-scan …`, `df:protected-path …`, ..., one finding after the other) for `REJECTED`,
  // the upstream's `ng` reason or the failure for `UPSTREAM_FAILED`.
  string reason = 5;
}

message RecordPushResponse {}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// A request of a run the proxy denied with `not-allowlisted`.
message Denial {
  string run_id = 1;
  // The requested host, normalized (lower case, no trailing dot).
  string host = 2;
  uint32 port = 3;
  google.protobuf.Timestamp at = 4;
}

message ReportDenialResponse {}

// ---------------------------------------------------------------------------
// Usage
// ---------------------------------------------------------------------------

message UsageBatch {
  // Name of the reporting gateway pod, for logs.
  string gateway_pod = 1;
  repeated UsageRecord records = 2;
}

// The usage of one model request (iter3-inference-gateway design D3).
message UsageRecord {
  // UUIDv7 chosen by the gateway; idempotency key of the record.
  string request_id = 1;
  string run_id = 2;
  // When the request ended.
  google.protobuf.Timestamp at = 3;
  // The model named in the response; empty if unknown.
  string model = 4;
  WireApi wire_api = 5;
  // Status of the upstream response; 0 if there was none (upstream unreachable).
  uint32 upstream_status = 6;
  // False if the response carried no usage; the token counts are then 0.
  bool usage_known = 7;
  uint64 input_tokens = 8;
  uint64 output_tokens = 9;
  uint64 cache_read_tokens = 10;
  uint64 cache_write_tokens = 11;
}

message ReportUsageResponse {}
